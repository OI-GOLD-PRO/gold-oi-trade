<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OI Gold Pro Trade</title>
<link rel="icon" type="image/png" href="icon/favicon-32.png">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="OI Trade">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
  /* Layout: แถบหัวราคา > ชิปข้อมูล OI > ปุ่มไทม์เฟรม > กราฟเต็มจอ (มี overlay วาดแท่ง OI ทับ) */
  :root {
    --bg: #0b1020;        /* พื้นหลังกราฟ น้ำเงินกรมเข้ม */
    --panel: #121a30;
    --line: #1f2a46;
    --fg: #e6e9f2;
    --muted: #8a93ab;
    --gold: #e0b44c;      /* สีแบรนด์ทอง ใช้กับราคา/ปุ่มที่เลือก */
    --put: #e5576b;       /* Put = แนวรับ (โทนแดง) */
    --call: #2fbf8f;      /* Call = แนวต้าน (โทนเขียว) */
    --live: #2fbf8f;
    --gmfi: #22d3ee;      /* gmf itd (Gamma Flip สัญญาวันนั้น) */
    --gmfm: #f59e0b;      /* gmf M (Gamma Flip ทุกสัญญา ≤30 วัน) */
    --mp: #ff3fb4;        /* Max Pain สีบานเย็น */      /* จุดสถานะเชื่อมต่อสด */
    --volc: #8ccaff;      /* Volume Call ฟ้าอ่อน */
    --volp: #ffb98a;      /* Volume Put ส้มอ่อน */
    --up: #26a69a;
    --down: #ef5350;
    --sans: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; height: 100dvh; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
  /* เต็มจอจริงบน iPhone (แอปจากหน้าโฮมบางรุ่นคิด 100dvh สั้นกว่าจอ ทำให้มีช่องว่างด้านล่าง) */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: auto; box-sizing: border-box; }
  /* iOS 26: ขอบบนจอ (ใต้แถบสถานะ) ถูกเบลอโดยระบบ ดันหัวแอปลงมาพ้นโซนเบลอ */
  /* iPhone: ให้แถบเวลา/คำอธิบายสีชิดขอบล่าง เหลือเว้นเฉพาะใต้ขีด Home เล็กน้อย */
  @supports (-webkit-touch-callout: none) { body { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 22px)); } }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px 6px; }
  .sym { display: flex; flex-direction: row; align-items: baseline; gap: 6px; min-width: 0; flex: 0 1 auto; }
  .sym b { white-space: nowrap; }
  #src { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header > * { flex: none; }
  header > .sym { flex: 0 1 auto; min-width: 0; }
  @media (max-width: 440px) { header { flex-wrap: wrap; gap: 6px !important; row-gap: 6px; } header > .sym { flex: 1 1 calc(100% - 64px); } header > .px { margin-left: auto; } button.icon { width: 32px; height: 32px; font-size: 14px; } .siren .new { display: none; } }
  .sym b { font-size: 15px; font-weight: 600; letter-spacing: .02em; }
  .symbtn { background: none; border: 0; color: inherit; padding: 0; display: flex; align-items: center; gap: 4px; font: inherit; text-align: left; }
  .symbtn i { font-style: normal; font-size: 10px; color: var(--gold); }
  #symMenu { position: absolute; top: 46px; left: 12px; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #symMenu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: var(--fg); padding: 9px 14px; border-radius: 8px; font: 600 14px var(--mono); white-space: nowrap; }
  #symMenu button.on { background: rgba(212,175,55,.16); color: var(--gold); }
  #symMenu button em { font-style: normal; font-size: 18px; }
  #symMenu button small { color: var(--muted); font: 10px var(--mono); }
  .sym span { font-size: 11px; color: var(--muted); }
  .px { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .px #price { font-size: 22px; font-weight: 600; color: var(--gold); }
  .px #chg { font-size: 11px; color: var(--muted); }
  /* ไซเรนข่าวแดง: กระพริบเมื่อข่าวจะออกภายใน 30 นาที */
  .siren { margin: 0 6px; flex: none; display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; color: inherit; font: inherit; line-height: 1; }
  .siren .bulb { font-size: 22px; filter: grayscale(.85) brightness(.75); }
  .siren .new { margin-top: 2px; font: 700 9px var(--mono); color: #3ddc84; letter-spacing: .03em; }
  .siren.on .bulb { filter: none; animation: sirenBlink .6s steps(2, start) infinite; }
  @keyframes sirenBlink { 0% { opacity: 1; filter: drop-shadow(0 0 6px #ff3b3b); } 100% { opacity: .25; } }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--live); box-shadow: 0 0 6px var(--live); }
  button.icon { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; width: 34px; height: 34px; font-size: 16px; flex: none; }
  header { gap: 8px !important; }
  /* หน้าเข้าสู่ระบบ: ทับทั้งจอจนกว่าจะใส่รหัสผ่านถูก */
  /* ===== อินโทรตอนเปิดแอป ===== */
  #splash { position: fixed; inset: 0; z-index: 80; background: radial-gradient(120% 80% at 50% 35%, #141b3a 0%, #0b1020 60%, #070a16 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
  #splash.out { animation: spOut .45s ease forwards; pointer-events: none; }
  @keyframes spOut { to { opacity: 0; transform: scale(1.06); filter: blur(4px); } }
  #splash .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 28px 28px; mask-image: radial-gradient(70% 55% at 50% 45%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(70% 55% at 50% 45%, #000 30%, transparent 75%); animation: spGrid 1.2s ease both; }
  @keyframes spGrid { from { opacity: 0; transform: translateY(14px); } }
  #splash .logo { position: relative; width: min(62vw, 300px); }
  #splash .logo svg { width: 100%; height: auto; display: block; overflow: visible; }
  #splash .oi { transform-origin: 50% 60%; animation: spOi .7s cubic-bezier(.2,1.4,.4,1) .15s both; }
  @keyframes spOi { from { opacity: 0; transform: translateY(18px) scale(.7); } }
  #splash .shine { animation: spShine 1.1s ease-in-out .75s both; }
  @keyframes spShine { from { transform: translateX(-160px); } to { transform: translateX(420px); } }
  #splash .gp { animation: spGp .6s ease .55s both; }
  @keyframes spGp { from { opacity: 0; letter-spacing: 18px; } to { opacity: 1; letter-spacing: 2px; } }
  #splash .bar { transform-box: fill-box; transform-origin: right center; animation: spBar .5s cubic-bezier(.2,.9,.3,1) both; }
  #splash .b1 { animation-delay: .85s; } #splash .b2 { animation-delay: .95s; } #splash .b3 { animation-delay: 1.05s; } #splash .b4 { animation-delay: 1.15s; }
  @keyframes spBar { from { transform: scaleX(0); opacity: .2; } }
  #splash .mp { stroke-dasharray: 22 14; animation: spFade .6s ease 1.1s both, spDash 1.2s linear 1.7s infinite; }
  #splash .mpMask { transform-box: fill-box; transform-origin: left center; animation: spWipe .6s ease 1.1s both; }
  @keyframes spWipe { from { transform: scaleX(0); } }
  @keyframes spDash { to { stroke-dashoffset: -36; } }
  #splash .px { margin-top: 26px; font: 600 15px ui-monospace, "SF Mono", Menlo, monospace; color: #e0b44c; letter-spacing: 1px; min-height: 18px; animation: spFade .4s ease 1.2s both; }
  #splash .load { margin-top: 12px; width: min(46vw, 220px); height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; animation: spFade .3s ease 1.2s both; }
  #splash .load i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #e0b44c, transparent); animation: spRun 1s ease-in-out infinite; }
  @keyframes spRun { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #splash .st { margin-top: 12px; min-height: 16px; font-size: 12px; color: #8a93ad; text-align: center; padding: 0 24px; }
  #splash .retry { margin-top: 10px; padding: 9px 22px; border: 0; border-radius: 10px; background: #e0b44c; color: #1a1405; font: 600 14px -apple-system, sans-serif; }
  #splash .tag { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); font-size: 11px; color: #8a93ad; letter-spacing: 1px; animation: spFade .5s ease 1.3s both; }
  @keyframes spFade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01ms !important; animation-delay: 0s !important; } }
  #login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  #login .card { width: 100%; max-width: 340px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 24px 20px; text-align: center; }
  #login h1 { margin: 0 0 4px; font: 600 22px var(--mono); color: var(--gold); letter-spacing: .03em; }
  #login p { margin: 0 0 18px; font-size: 13px; color: var(--muted); }
  #login input { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 16px var(--mono); text-align: center; letter-spacing: .12em; outline: none; }
  #login input:focus { border-color: var(--gold); }
  #login button { width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 10px; background: var(--gold); color: #1a1405; font: 600 15px var(--sans); }
  #login button:disabled { opacity: .6; }
  #login .err { min-height: 18px; margin-top: 10px; font-size: 13px; color: var(--put); }
  #login .ver { margin-top: 14px; font: 11px var(--mono); color: var(--muted); }
  button.icon:active { transform: scale(.95); }
  .chips { display: flex; gap: 6px; padding: 0 14px 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; font-size: 11px; padding: 4px 8px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .chip b { color: var(--fg); font-family: var(--mono); font-weight: 600; }
  .chip.warn { border-color: #7a5a1c; color: var(--gold); }
  .tfs { display: flex; gap: 3px; padding: 0 14px 6px; }
  .tfs button { flex: 1; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 3px 0; font: 600 10.5px var(--mono); }
  .tfs button.on { background: var(--gold); border-color: var(--gold); color: #1a1405; }
  .tfs button#oiBtn, .tfs button#indBtn, .tfs button#drawBtn { flex: none; padding: 3px 9px; font-style: italic; }
  .tfs button#oiBtn.has, .tfs button#indBtn.has, .tfs button#drawBtn.has { border-color: var(--gold); color: var(--gold); }
  #drawBar { position: absolute; left: 8px; right: 8px; top: 6px; z-index: 6; display: flex; flex-wrap: wrap; gap: 5px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #drawBar button { background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 7px; padding: 6px 8px; font: 600 11.5px var(--sans); }
  #drawBar button.on { background: var(--gold); border-color: var(--gold); color: #1a1405; }
  #indMenu { max-height: 62vh; overflow: auto; }
  #indMenu .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #indMenu .row > button { min-width: 112px; }
  #indMenu .ps { display: flex; gap: 4px; flex-wrap: wrap; }
  #indMenu label { display: flex; flex-direction: column; font: 9.5px var(--sans); color: var(--muted); }
  #indMenu input { width: 46px; padding: 3px 4px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 12px var(--mono); }
  #indMenu .reset { justify-content: center; font: 600 11px var(--sans); }
  /* Gold Scalping ในเมนู ƒx */
  #gsTbl { display: none; gap: 3px; padding: 0 14px 5px; }
  #gsTbl.on { display: flex; }
  #gsTbl .c { flex: 1; border: 1px solid var(--line); border-radius: 6px; padding: 2px 0 3px; text-align: center; font: 600 9.5px var(--mono); color: var(--muted); min-width: 0; }
  #gsTbl .c.cur { border-color: var(--gold); }
  #gsTbl .c b { display: block; font-size: 10px; color: var(--fg); }
  #gsTbl .a { display: flex; justify-content: center; gap: 1px; font-size: 9px; line-height: 12px; }
  #gsTbl .a i { font-style: normal; width: 8px; }
  #gsTbl .u { color: #26c281; } #gsTbl .d { color: #ef5350; } #gsTbl .u.s, #gsTbl .d.s { font-weight: 900; }
  #indMenu .gsbox { display: grid; gap: 5px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  #indMenu .gsbox .row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  #indMenu .gsbox .gsb { padding: 5px 8px; font: 600 11px var(--sans); }
  #indMenu .gsbox .gsinfo { font: 10px var(--sans); color: var(--muted); }
  #indMenu .gsbox select { padding: 3px 2px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); font: 600 11px var(--mono); }
  #indMenu { position: absolute; right: 8px; top: 6px; z-index: 6; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: grid; gap: 5px; box-shadow: 0 6px 20px rgba(0,0,0,.45); min-width: 170px; }
  #indMenu .t { font: 600 11px var(--sans); color: var(--muted); padding: 0 2px 2px; }
  #indMenu button { display: flex; align-items: center; gap: 8px; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 7px; padding: 6px 9px; font: 600 12px var(--mono); text-align: left; }
  #indMenu button i { width: 14px; height: 3px; border-radius: 2px; flex: none; }
  #indMenu button.on { color: var(--fg); border-color: var(--gold); background: rgba(224,180,76,.12); }
  /* เลย์เอาต์ 2 กราฟ */
  #main { position: relative; display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; min-width: 0; }
  #paneB { flex: 1 1 0; min-height: 0; min-width: 0; border: 0; background: var(--bg); }
  body.lay-h { flex-direction: row; }
  .embed .chips, .embed .legend { display: none !important; }
  /* โหมด 2 กราฟ: ซ่อนคำอธิบายสีด้านล่าง ให้กราฟได้พื้นที่มากขึ้น */
  body.lay-v .legend, body.lay-h .legend, body.lay-v .chips, body.lay-h .chips { display: none !important; }
  .embed header { padding: 6px 10px 2px; gap: 8px; }
  .embed header .siren, .embed header button.icon, .embed .sym span { display: none !important; }
  .embed .px #price { font-size: 17px; } .embed .px #chg { font-size: 10px; }
  .embed .px { margin-left: auto; }
  /* แถบลากปรับขนาดสองกราฟ */
  #splitter { flex: none; position: relative; background: var(--panel); touch-action: none; z-index: 5; }
  #splitter::after { content: ''; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--gold); border-radius: 3px; opacity: .85; }
  body.lay-v #splitter { height: 14px; cursor: row-resize; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--line); }
  body.lay-v #splitter::after { width: 44px; height: 4px; }
  body.lay-h #splitter { width: 14px; cursor: col-resize; border-left: 1px solid var(--gold); border-right: 1px solid var(--line); }
  body.lay-h #splitter::after { width: 4px; height: 44px; }
  .embed body { padding-top: 0; padding-bottom: 0; }
  .embed .tfs { padding-top: 4px; }
  body.half .tfs, body.half .chips { overflow-x: auto; scrollbar-width: none; }
  body.half .tfs button { flex: none; padding: 3px 8px; }
  body.half header { gap: 5px !important; padding: 8px 8px 4px; }
  body.half header { flex-wrap: wrap; row-gap: 4px; }
  body.half button.icon { width: 28px; height: 28px; font-size: 13px; border-radius: 8px; }
  body.half .px { margin-left: auto; }
  body.half .siren, body.half .sym span { display: none; }
  body.half .px #price { font-size: 16px; }
  body.half .px #chg { font-size: 9px; }
  body.half .chips, body.half .tfs, body.half #gsTbl { padding-left: 8px; padding-right: 8px; }
  #wrap { position: relative; flex: 1; min-height: 0; border-top: 1px solid var(--line); }
  #chart, #ov { position: absolute; inset: 0; }
  #chart { z-index: 1; }
  #ov { pointer-events: none; z-index: 2; }
  #tip { position: absolute; left: 10px; top: 8px; z-index: 3; font-size: 12px; background: rgba(18,26,48,.92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-family: var(--mono); pointer-events: none; }
  #tip .p { color: var(--put); } #tip .c { color: var(--call); }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: var(--muted); font-size: 13px; z-index: 4; pointer-events: none; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 6px 14px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  .legend i { display: inline-block; width: 10px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
  .legend .rt { margin-left: auto; font-family: var(--mono); }
  button.icon.on { border-color: var(--gold); color: var(--gold); }
  #toast { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 5; background: #2a2208; border: 1px solid var(--gold); color: var(--fg); border-radius: 10px; padding: 9px 12px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.45); }
  #toast b { color: var(--gold); font-family: var(--mono); }
</style>

<body>
  <div id="splash" aria-label="OI Trade กำลังเปิด">
    <div class="grid"></div>
    <div class="logo">
      <svg viewBox="0 0 512 470" aria-hidden="true">
        <defs>
          <linearGradient id="spG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c862"/><stop offset="1" stop-color="#d8a63c"/></linearGradient>
          <linearGradient id="spSh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <clipPath id="spClip"><text x="256" y="185" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-weight="700" font-size="175">OI</text></clipPath>
        </defs>
        <g class="oi">
          <text x="256" y="185" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-weight="700" font-size="175" fill="url(#spG)">OI</text>
          <g clip-path="url(#spClip)"><rect class="shine" x="0" y="20" width="90" height="200" fill="url(#spSh)" transform="skewX(-20)"/></g>
        </g>
        <text class="gp" x="256" y="290" text-anchor="middle" font-family="Verdana, 'DejaVu Sans', sans-serif" font-weight="700" font-size="44" fill="#e8ecf6" letter-spacing="2">GOLD PRO</text>
        <rect class="bar b1" x="246" y="332" width="194" height="26" rx="13" fill="#2fbf8f"/>

<script>
(function () {
  // สัญลักษณ์ที่เลือกได้: แต่ละตัวมีแท็บ OI/offset ในชีตของตัวเอง (ทอง = แท็บเดิม)

  };
  const EMBED = false, PSFX = '', LAY = '';
  let SYM = 'gold';
  const SC = SYMS[SYM], SYMSFX = SYM === 'gold' ? '' : '_' + SYM;
  const DATA_SYM = SC.dataSym || SYM;         // gcy ใช้ OI/Volume ชุดเดียวกับทอง
  const IS_GOLD = SYM === 'gold' || SYM === 'gcy';
  const SYMBOL = SC.perp || (SC.yahoo === 'GC' ? 'XAUTUSDT' : null); // GC(Yahoo): ใช้ perp ทองต่อปลายกราฟ
  // เวอร์ชันแอป: แก้เล็กเพิ่มเลขท้าย (2 หลัก), เพิ่มฟีเจอร์ใหญ่เพิ่มเลขกลาง
  const APP_VER = '0.9.01'; // based on OI Gold Pro V2.0.7
  const ZONE_HALF = SC.zone; // ครึ่งความกว้างโซนกำแพง OI ต่อสัญลักษณ์ (ทอง ±2.5 = $5, น้ำมัน ±0.15 = $0.3)
  const TZ_SHIFT = 7 * 3600; // แสดงเวลาไทยบนแกนเวลา

  const $ = id => document.getElementById(id);

  // iPhone ใช้ position:fixed เต็มจอแทน (innerHeight ในแอปจากหน้าโฮมสั้นกว่าจอจริง ทำให้มีช่องว่างล่าง)
  const IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const fitH = () => { document.body.style.height = IOS ? '' : window.innerHeight + 'px'; };
  fitH(); window.addEventListener('resize', fitH); window.addEventListener('orientationchange', () => setTimeout(fitH, 300));
  const css = getComputedStyle(document.documentElement);

  let tf = '5m';
  try { tf = localStorage.getItem('oit_tf' + PSFX) || '5m'; } catch (e) { /* ใช้ค่าเริ่มต้น */ }
  let ws = null, wsTimer = null, lastClose = null, dayOpen = null;
  // ปรับราคากราฟ perpetual ให้เท่าราคา GC (ทองฟิวเจอร์): ราคาที่แสดง = ราคา perp − adj
  // adj = (perp − spot) − carry  โดย carry = GC − spot จากชีต (วัดตอนอัพเดท) และรีเฟรชทุก 1 ชม.

    timeScale: { borderColor: C('--line'), timeVisible: true, secondsVisible: false, rightOffset: 8 },

  });
  const series = chart.addCandlestickSeries({
    upColor: C('--up'), downColor: C('--down'), borderVisible: false,
    wickUpColor: C('--up'), wickDownColor: C('--down'),
    priceFormat: { type: 'price', precision: SC.dec, minMove: SC.tick },
  });

  // ---------- ข้อมูล OI ----------
  let oi = null; // {rows:[{strike,p,c,price}], offset, maxOI}

  let lastCfg = null;
  function buildOI(d) {
    lastCfg = d.cfg || {};
    oi = calcOI(d); rebaseOI();
    afterOI(d);
  }
  // OI ใหม่จาก Worker (TradingView) ของสัญญาที่หมดอายุวันนั้น: คำนวณแนว/กำแพง/Max Pain ใหม่ ไม่แตะ offset
  function setLevels(levels, contract, note) {
    if (!lastCfg) return;
    lastCfg = Object.assign({}, lastCfg, { contract });
    oi = calcOI({ levels, cfg: lastCfg }); rebaseOI();
    const ch = document.querySelector('#chips .chip');
    if (ch && /สัญญา/.test(ch.textContent)) ch.innerHTML = `สัญญา <b>${esc(contract)}</b>${note ? ` <small>${esc(note)}</small>` : ''}`;
    dirty = true;
  }
  function calcOI(d) {
    const off = Number(d.cfg && d.cfg.offset);
    const map = new Map();
    (d.levels || []).forEach(l => {
      const r = map.get(l.strike) || { strike: l.strike, p: 0, c: 0 };
      if (l.type === 'P') { r.p += l.oi; }
      else { r.c += l.oi; }
      map.set(l.strike, r);
    });
    const rows = [...map.values()].sort((a, b) => a.strike - b.strike);
    const ok = isFinite(off);
    const cr = Number(d.cfg && d.cfg.carry);
    carry = (d.cfg && d.cfg.carry !== undefined && d.cfg.carry !== '' && isFinite(cr)) ? cr : null;
    rows.forEach(r => { r.price = ok ? r.strike : null; });
    const maxOI = Math.max(1, ...rows.map(r => Math.max(r.p, r.c)));
    // volume ระหว่างวัน: แท็บ webapp key "volume" = {"strike":[call,put]}
    let vol = {};
    try { vol = d.cfg && d.cfg.volume ? JSON.parse(d.cfg.volume) : {}; } catch (e) { vol = {}; }
    rows.forEach(r => { const v = vol[String(r.strike)]; r.vc = v ? Number(v[0]) : null; r.vp = v ? Number(v[1]) : null; });
    const maxVol = Math.max(1, ...rows.map(r => Math.max(r.vc || 0, r.vp || 0)));
    const hasVol = rows.some(r => r.vc !== null || r.vp !== null);
    const topP = [...rows].sort((a, b) => b.p - a.p).slice(0, 3).map(r => r.strike);
    const topC = [...rows].sort((a, b) => b.c - a.c).slice(0, 3).map(r => r.strike);
    const topV = [...rows].filter(r => (r.vc || 0) + (r.vp || 0) > 0)
      .sort((a, b) => ((b.vc || 0) + (b.vp || 0)) - ((a.vc || 0) + (a.vp || 0))).slice(0, 5).map(r => r.strike);
    const top5P = [...rows].filter(r => r.p > 0).sort((a, b) => b.p - a.p).slice(0, 5).map(r => r.strike);
    const top5C = [...rows].filter(r => r.c > 0).sort((a, b) => b.c - a.c).slice(0, 5).map(r => r.strike);
    // โซนกำแพง: อันดับ 1-5 ต่อฝั่ง = กว้างเต็ม, อันดับ 6-10 = กว้างครึ่งหนึ่ง
    const rankMap = k => { const m = new Map(); [...rows].filter(r => r[k] > 0).sort((a, b) => b[k] - a[k]).slice(0, 10).forEach((r, i) => m.set(r.strike, i + 1)); return m; };
    const rankP = rankMap('p'), rankC = rankMap('c');
    offRaw = ok ? off : null;
    // Max Pain: ราคาหมดอายุที่ผู้ถือ Call+Put ได้มูลค่ารวมน้อยที่สุด
    let maxPain = null, best = Infinity;
    rows.forEach(s => {
      const pay = rows.reduce((a, r) => a + r.c * Math.max(0, s.strike - r.strike) + r.p * Math.max(0, r.strike - s.strike), 0);
      if (pay < best) { best = pay; maxPain = s.strike; }
    });
    // Gamma Flip: แท็บ webapp key "gmf" = {"itd":ราคา,"M":ราคา,...} (คำนวณตอนอัพเดทจาก OI CME + Black-76)
    let gmf = [];
    try {
      const g = d.cfg && d.cfg.gmf ? JSON.parse(d.cfg.gmf) : null;
      if (g && isFinite(+g.itd) && g.itd !== null) gmf.push({ p: +g.itd, lab: 'gmf itd', col: '--gmfi' });
      if (g && isFinite(+g.M) && g.M !== null) gmf.push({ p: +g.M, lab: 'gmf M', col: '--gmfm' });
    } catch (e) { gmf = []; }
    { const lg = document.getElementById('gmflg'); if (lg) lg.style.display = gmf.length ? '' : 'none'; }
    return { top5P, top5C, rows, offset: ok ? off : null, maxOI, maxVol, hasVol, topP, topC, topV, maxPain, rankP, rankC, gmf, mpPrice: null };
  }
  function afterOI(d) {

    const cfg = d.cfg || {};

    chips.push(`<span class="chip" id="rawchip"></span>`);
    chips.push(`<span class="chip" id="newschip" hidden></span>`);
    if (authExpire) chips.push(`<span class="chip">${expLabel(authExpire)} <b>${esc(fmtExpire(authExpire))}</b></span>`);
    $('chips').innerHTML = chips.join('');
    paintRaw(); paintNextNews();
    // offset ล็อก: ใช้ค่าจากชีตตรง ๆ (คำนวณจาก Low ฟิวเจอร์ของวัน เทียบ Low ของกราฟเรา) ไม่ลอยตามราคา spot อีกต่อไป
    if (SC.yahoo) paintOff(); // กราฟ Yahoo เป็นราคา GC อยู่แล้ว ไม่ต้องบวก offset
    else if (ok && (liveAt === null || SYM !== 'gold')) applyAdj(-off); else paintOff();
    dirty = true;
    if (typeof resetArming === 'function') resetArming(lastClose);
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch])); }

  // ข้อมูล OI ดึงจาก Apps Script (?api=data) ซึ่งอ่านชีตให้
  // ข้อมูล OI และการเข้าสู่ระบบผ่าน hub ของแอปเทรด (hub อ่านข้อมูล OI ให้แบบอ่านอย่างเดียว)
  const HUB = 'https://oi-trade-hub.oigoldpro.workers.dev';

  // Sync ข้อมูลจากชีต: หมดเวลา 15 วินาทีต่อครั้ง ลองใหม่สูงสุด 3 ครั้ง
  // ถ้ามีข้อมูลชุดเดิมอยู่แล้ว จะไม่ล้างชิปทิ้งระหว่างโหลด (เส้น OI ยังแสดงต่อ)
  let syncing = false;
  async function loadSheet() {
    if (syncing || !authCode) return;
    syncing = true;
    if (!oi) $('chips').innerHTML = '<span class="chip">กำลัง Sync Data…</span>';
    let err = null;
    for (let i = 0; i < 3; i++) {
      const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 15000);
      try {
        const r = await fetch(HUB + '/app/oi?t=' + Date.now(), { cache: 'no-store', signal: ac.signal, headers: { 'X-Key': authCode } });
        if (r.status === 401) { const j = await r.json().catch(() => ({})); syncing = false; showLogin(j.reason === 'expired' ? 'รหัสผ่านนี้หมดอายุแล้ว' : 'รหัสผ่านใช้ไม่ได้แล้ว กรุณาเข้าสู่ระบบใหม่'); return; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const d = await r.json();
        if (d.error === 'auth') { syncing = false; showLogin(d.reason === 'expired' ? 'รหัสผ่านนี้หมดอายุแล้ว' : 'รหัสผ่านใช้ไม่ได้แล้ว กรุณาเข้าสู่ระบบใหม่'); return; }
        if (d.auth && d.auth.expire) authExpire = d.auth.expire;
        if (DATA_SYM !== 'gold' && d.sym !== DATA_SYM) { $('chips').innerHTML = `<span class="chip warn">Apps Script ยังเป็นรุ่นเก่า ไม่รองรับ ${esc(SC.label)} (ต้องวางโค้ด Code.gs ใหม่แล้ว Deploy)</span>`; oi = null; dirty = true; err = null; break; }
        buildOI(d);
        err = null; break;
      } catch (e) {
        err = e.name === 'AbortError' ? 'หมดเวลา' : (e.message || e);
        if (!oi) $('chips').innerHTML = `<span class="chip">กำลัง Sync Data… (ลองใหม่ครั้งที่ ${i + 2})</span>`;
        await new Promise(r => setTimeout(r, 1500));
      } finally { clearTimeout(timer); }
    }
    syncing = false;
    if (err && !oi) $('chips').innerHTML = `<span class="chip warn">Sync Data ไม่สำเร็จ: ${esc(err)} กด ⟳ ลองใหม่</span>`;
  }

  // ---------- overlay แท่ง OI ----------
  const ov = $('ov'), ctx = ov.getContext('2d');
  let dirty = true, lastKey = '';
  const overlayHooks = []; // ส่วนเสริม (เช่น goldscalp.js) วาดทับกราฟได้

  // ---------- กรอบเหลืองคลอบเลขราคาบนแกนขวา (เฉพาะกราฟทอง) ----------
  // ไฮไลต์ราคาเต็มที่ลงท้ายด้วย 00, 25, 50, 75 โดยวาดทับป้ายแกนของ lightweight-charts
  const GOLD_HL = ['00', '25', '50', '75'];
  function drawGoldLevels(w, h) {
    if (!IS_GOLD || lastClose === null) return;
    const plotH = h - chart.timeScale().height();
    const top = series.coordinateToPrice(0), bot = series.coordinateToPrice(plotH);
    if (top === null || bot === null) return;
    const axW = chart.priceScale('right').width();
    if (!axW) return;
    const x0 = w - axW + 2, bw = axW - 4, bh = 16;

      else ctx.rect(x0 + .5, y - bh / 2 + .5, bw - 1, bh - 1);
      ctx.stroke();
      ctx.fillStyle = '#ffd60a';
      ctx.fillText(v.toFixed(SC.dec), x0 + bw / 2, y + .5);

  function drawOverlay() {
    const w = chartEl.clientWidth, h = chartEl.clientHeight, dpr = window.devicePixelRatio || 1;
    if (ov.width !== Math.round(w * dpr) || ov.height !== Math.round(h * dpr)) {
      ov.width = Math.round(w * dpr); ov.height = Math.round(h * dpr);
      ov.style.width = w + 'px'; ov.style.height = h + 'px';
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // วาดทีละชั้น: ชั้นไหนพังจะไม่ทำให้ชั้นอื่น (เช่นกรอบ OI) หายไปด้วย
    [drawSessions, drawNews, drawOIBars, drawSpotAxis, drawGoldLevels, drawDrawings, drawMeasure].forEach(f => {
      try { ctx.save(); f(w, h); } catch (e) { console.error(e); } finally { ctx.restore(); ctx.globalAlpha = 1; ctx.setLineDash([]); }
    });
    overlayHooks.forEach(f => { try { f(ctx, w, h); } catch (e) { console.error(e); } });
  }

  // ---------- แกนราคา spot (ปัดแกนราคาขวาไปทางซ้ายเพื่อเปิด ปัดกลับเพื่อปิด) ----------
  // ราคา spot = ราคา XAUUSD ของแหล่งกราฟก่อนบวก offset = ราคาบนกราฟ + adj
  let spotAxisOn = false, spotW = 80;
  try { spotAxisOn = localStorage.getItem('oit_spotaxis' + PSFX) === '1'; } catch (e) {}
  function niceStep(range, n) {
    const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * p) return m * p;
    return 10 * p;
  }
  function drawSpotAxis(w, h) {
    if (!spotAxisOn || !rawBars.length) return;
    const plotW = chart.timeScale().width(), plotH = h - chart.timeScale().height();
    const top = series.coordinateToPrice(0), bot = series.coordinateToPrice(plotH);
    if (top === null || bot === null) return;
    ctx.font = `11px ${C('--mono')}`;
    const aw = Math.ceil(ctx.measureText('0000.00').width) + 12, x0 = plotW - aw;
    spotW = aw;
    ctx.globalAlpha = 0.94; ctx.fillStyle = C('--panel'); ctx.fillRect(x0, 0, aw, plotH);
    ctx.globalAlpha = 1; ctx.strokeStyle = C('--gold'); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0 + .5, 0); ctx.lineTo(x0 + .5, plotH); ctx.stroke();
    const sTop = top + gcOff(), sBot = bot + gcOff(), step = niceStep(sTop - sBot, Math.max(3, plotH / 45));
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillStyle = C('--fg');
    for (let v = Math.ceil(sBot / step) * step; v <= sTop; v += step) {
      const y = series.priceToCoordinate(v - gcOff());
      if (y === null || y < 22 || y > plotH - 8) continue;
      ctx.globalAlpha = .55; ctx.beginPath(); ctx.moveTo(x0, Math.round(y) + .5); ctx.lineTo(x0 + 4, Math.round(y) + .5); ctx.stroke();
      ctx.globalAlpha = .85; ctx.fillText(v.toFixed(2), x0 + 6, y);
    }
    ctx.globalAlpha = 1;
    // ราคาล่าสุด
    if (rawClose !== null && lastClose !== null) {
      const y = series.priceToCoordinate(lastClose);
      if (y !== null && y > 0 && y < plotH) {
        ctx.fillStyle = C('--gold'); ctx.fillRect(x0 + 1, y - 8, aw - 1, 16);
        ctx.fillStyle = '#000'; ctx.fillText((lastClose + gcOff()).toFixed(2), x0 + 6, y + .5);
      }
    }
    ctx.fillStyle = C('--gold'); ctx.font = `bold 10px ${C('--mono')}`; ctx.textAlign = 'center';
    ctx.fillText('GC', x0 + aw / 2, 9);
    ctx.textAlign = 'left';
  }
  function setSpotAxis(on) {
    if (spotAxisOn === on) return;
    spotAxisOn = on; dirty = true;
    try { localStorage.setItem('oit_spotaxis' + PSFX, on ? '1' : '0'); } catch (e) {}
  }

  // ---------- วัดระยะ: นิ้วแรกแตะค้าง แล้วนิ้วที่สองแตะค้าง/ลากเพื่อวัด ----------
  let meas = null; // {ax, ay, ap, al, bx, by, armed}
  function drawMeasure(w, h) {
    if (!meas) return;
    const ts = chart.timeScale(), plotH = h - ts.height();
    const ay = series.priceToCoordinate(meas.ap), ax = ts.logicalToCoordinate(Math.round(meas.al));
    const axx = ax === null ? meas.ax : ax + (meas.al - Math.round(meas.al)) * barSp();
    const ayy = ay === null ? meas.ay : ay;
    ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(axx, ayy, 5, 0, Math.PI * 2); ctx.globalAlpha = .9; ctx.stroke();
    ctx.setLineDash([3, 3]); ctx.globalAlpha = .4;
    ctx.beginPath(); ctx.moveTo(0, Math.round(ayy) + .5); ctx.lineTo(ts.width(), Math.round(ayy) + .5); ctx.stroke();
    ctx.setLineDash([]);
    if (meas.bx === null) { ctx.globalAlpha = 1; return; }
    const bp = series.coordinateToPrice(meas.by), bl = ts.coordinateToLogical(meas.bx);
    if (bp === null || bl === null) { ctx.globalAlpha = 1; return; }
    const d = bp - meas.ap, up = d >= 0, col = up ? C('--up') : C('--down');
    // กล่องพื้นที่ระหว่างสองจุด
    ctx.globalAlpha = .16; ctx.fillStyle = col;
    ctx.fillRect(Math.min(axx, meas.bx), Math.min(ayy, meas.by), Math.abs(meas.bx - axx), Math.abs(meas.by - ayy));
    ctx.globalAlpha = .95; ctx.strokeStyle = col; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(axx, ayy); ctx.lineTo(meas.bx, meas.by); ctx.stroke();
    ctx.beginPath(); ctx.arc(meas.bx, meas.by, 5, 0, Math.PI * 2); ctx.stroke();
    // ข้อความ: ระยะราคา, %, จำนวนแท่ง และเวลา
    const bars = Math.round(bl - meas.al);
    const mins = Math.abs(bars) * (tfSec[tf] || 60) / 60;
    const dur = mins >= 1440 ? (mins / 1440).toFixed(1).replace(/\.0$/, '') + ' วัน' : mins >= 60 ? Math.floor(mins / 60) + ' ชม.' + (mins % 60 ? ' ' + Math.round(mins % 60) + ' น.' : '') : Math.round(mins) + ' นาที';
    const pts = Math.round(Math.abs(d) / SC.tick); // ทอง: $1 = 100 จุด
    const lines = [`${up ? '+' : '−'}${Math.abs(d).toFixed(2)} $  (${up ? '+' : '−'}${Math.abs(d / meas.ap * 100).toFixed(2)}%)`, `${up ? '+' : '−'}${pts.toLocaleString('en-US')} จุด`, `${Math.abs(bars)} แท่ง · ${dur}`, `${meas.ap.toFixed(2)} → ${bp.toFixed(2)}`];
    ctx.font = `bold 12px ${C('--mono')}`;
    const tw = Math.max(...lines.map(s => ctx.measureText(s).width)) + 16, th = 70;
    let tx = meas.bx - tw / 2, ty = up ? meas.by - th - 34 : meas.by + 34;
    tx = Math.max(4, Math.min(ts.width() - tw - 4, tx)); ty = Math.max(4, Math.min(plotH - th - 4, ty));
    ctx.globalAlpha = .95; ctx.fillStyle = col;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(tx, ty, tw, th, 6); else ctx.rect(tx, ty, tw, th); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(lines[0], tx + tw / 2, ty + 11);
    ctx.font = `11px ${C('--mono')}`;
    ctx.font = `bold 11px ${C('--mono')}`; ctx.fillText(lines[1], tx + tw / 2, ty + 27);
    ctx.font = `11px ${C('--mono')}`;
    ctx.fillText(lines[2], tx + tw / 2, ty + 43); ctx.fillText(lines[3], tx + tw / 2, ty + 59);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
  function barSp() {
    const ts = chart.timeScale(), a = ts.logicalToCoordinate(1), b = ts.logicalToCoordinate(2);
    return (a !== null && b !== null) ? b - a : 6;
  }

  let oiOn = true;
  try { oiOn = localStorage.getItem('oit_show' + PSFX) !== '0'; } catch (e) {}
  function drawOIBars(w, h) {
    if (!oiOn) return;
    if (!oi || oi.offset === null || !oi.rows.length) return;

    const plotW = chart.timeScale().width();
    const plotH = h - chart.timeScale().height();
    const barMax = Math.min(plotW * 0.32, 150);
    const yMax = plotH * (1 - oscFrac) - 2;
    const pts = oi.rows.map(r => ({ r, y: series.priceToCoordinate(r.price) })).filter(o => o.y !== null && o.y > 2 && o.y < yMax);
    if (!pts.length) return;
    let gap = Infinity;
    for (let i = 1; i < pts.length; i++) gap = Math.min(gap, Math.abs(pts[i].y - pts[i - 1].y));
    const thick = Math.max(2, Math.min(6, gap / 2 - 1));
    const putC = C('--put'), callC = C('--call');
    const volMax = Math.min(plotW * 0.14, 60);
    const volC = C('--gold');
    ctx.font = `10px ${C('--mono')}`;
    const padL = Math.ceil(ctx.measureText('00000').width) + 8; // ที่ว่างซ้ายสำหรับเลข strike (ราคาฟิวเจอร์)

    ctx.font = `10px ${C('--mono')}`;
    ctx.textBaseline = 'middle';
    pts.forEach(({ r, y }) => {
      const big = oi.topP.includes(r.strike) && r.p > 0 || oi.topC.includes(r.strike) && r.c > 0;
      const strength = Math.max(r.p, r.c) / oi.maxOI;
      // เส้นระดับจาง ๆ ทุก strike
      const yy = Math.round(y) + .5, mid = plotW / 2;
      const hline = (x0, x1) => { ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke(); };
      // เส้นประเฉพาะ OI มากสุด 5 อันดับของแต่ละฝั่ง
      const in5C = oi.top5C.includes(r.strike), in5P = oi.top5P.includes(r.strike);
      if (in5C || in5P) {
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = (in5C && (!in5P || r.c >= r.p)) ? callC : putC;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 3]); hline(0, plotW); ctx.setLineDash([]);
      }
      // กำแพง OI 10 อันดับต่อฝั่ง (Call เขียว / Put แดง): อันดับ 1-5 โซนเต็ม + เส้นทึบ, อันดับ 6-10 โซนครึ่งความกว้าง (ไม่มีเส้นทึบ)
      const rC = r.c > 0 ? (oi.rankC.get(r.strike) || 0) : 0, rP = r.p > 0 ? (oi.rankP.get(r.strike) || 0) : 0;
      if (rC || rP) {
        const useC = rC && (!rP || r.c >= r.p);
        const rk = useC ? rC : rP, wallC = useC ? callC : putC;
        const half = rk <= 5 ? ZONE_HALF : ZONE_HALF / 2;
        const yTop = series.priceToCoordinate(r.price + half), yBot = series.priceToCoordinate(r.price - half);
        if (yTop !== null && yBot !== null) {
          ctx.globalAlpha = 0.16; ctx.fillStyle = wallC;
          ctx.fillRect(mid, Math.min(yTop, yBot), plotW - mid, Math.abs(yBot - yTop));
        }
        if (rk <= 5) { ctx.globalAlpha = 0.95; ctx.lineWidth = 2; ctx.strokeStyle = wallC; hline(mid, plotW); }
      }
      // Volume วันนี้ 5 อันดับ: เส้นทึบสีเหลืองจากขอบซ้ายถึงขอบขวาของกราฟ (เต็มจอ)
      if (oi.topV && oi.topV.includes(r.strike)) {
        ctx.globalAlpha = 0.95; ctx.lineWidth = 2; ctx.strokeStyle = volC;
        hline(0, plotW);
      }
      // แท่ง Call (บนเส้น) และ Put (ใต้เส้น) ยื่นจากขอบขวา
      ctx.globalAlpha = 0.9;
      if (r.c > 0) { const L = Math.max(2, barMax * r.c / oi.maxOI); ctx.fillStyle = callC; ctx.fillRect(plotW - L, y - thick, L, thick); }
      if (r.p > 0) { const L = Math.max(2, barMax * r.p / oi.maxOI); ctx.fillStyle = putC; ctx.fillRect(plotW - L, y, L, thick); }

      // Volume ระหว่างวัน: แท่งจากขอบซ้าย (Call บนเส้น / Put ใต้เส้น)
      let leftEnd = padL;
      if (oi.hasVol) {
        const volX = padL;
        ctx.globalAlpha = 0.6;
        if (r.vc) { const L = Math.max(2, volMax * r.vc / oi.maxVol); ctx.fillStyle = C('--volc'); ctx.fillRect(volX, y - thick, L, thick); }
        if (r.vp) { const L = Math.max(2, volMax * r.vp / oi.maxVol); ctx.fillStyle = C('--volp'); ctx.fillRect(volX, y, L, thick); }
        leftEnd = volX + volMax;
      }

      // ป้ายตัวเลข
      ctx.globalAlpha = 1;
      // เลข strike (ราคาฟิวเจอร์) ชิดซ้าย
      if (gap >= 13 || big || strength >= 0.35) {
        ctx.fillStyle = big ? C('--fg') : C('--muted');
        ctx.textAlign = 'left';
        ctx.fillText(String(r.strike), 4, y);
      }
      // OI ฝั่งขวา: แสดงเมื่อ Call หรือ Put ตั้งแต่ 30
      if (Math.max(r.c, r.p) >= 30) {
        ctx.fillStyle = big ? C('--fg') : C('--muted');
        const lab = `${r.c ? 'C' + r.c : ''}${r.c && r.p ? ' ' : ''}${r.p ? 'P' + r.p : ''}`;
        const L = barMax * Math.max(r.p, r.c) / oi.maxOI;
        ctx.textAlign = 'right';
        ctx.fillText(lab, plotW - L - 4, y - 7); // ขยับขึ้นให้พ้นเส้นกำแพง
      }
      // Volume: ใต้เลข strike ฝั่งซ้าย (ต้องมีที่ว่างระหว่างเส้นพอ)
      if (gap >= 24) {
        const vl = (r.vc || r.vp) ? `V ${r.vc || 0}/${r.vp || 0}` : '';
        const txt = vl;
        if (txt) {
          ctx.font = `9px ${C('--mono')}`;
          ctx.textAlign = 'left'; ctx.fillStyle = C('--muted');
          ctx.fillText(txt, 4, y + thick + 7);
          ctx.font = `10px ${C('--mono')}`;
        }
      }
    });
    // เส้น Max Pain: เส้นประสีบานเย็นเต็มความกว้าง พร้อมป้ายกำกับ
    if (oi.maxPain !== null) {
      const ym = series.priceToCoordinate(oi.mpPrice);
      if (ym !== null && ym > 2 && ym < plotH - 2) {
        const yy = Math.round(ym) + .5, mpC = C('--mp');
        ctx.globalAlpha = 0.95; ctx.strokeStyle = mpC; ctx.lineWidth = 1.5; ctx.setLineDash([6, 4]);
        ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke(); ctx.setLineDash([]);
        // ป้ายราคาที่แกนขวา (กรอบสีบานเย็น) และคำว่า Max Pain ใต้กรอบ ไม่บังกราฟ
        const lab = oi.mpPrice.toFixed(2);
        ctx.font = `bold 10px ${C('--mono')}`;
        const axW = w - plotW, bh = 14, bx = plotW + 1, by = Math.round(ym - bh / 2);
        ctx.globalAlpha = 1; ctx.fillStyle = mpC; ctx.fillRect(bx, by, axW - 1, bh);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(lab, bx + (axW - 1) / 2, by + bh / 2 + .5);
        ctx.font = `bold 8px ${C('--mono')}`;
        ctx.fillStyle = C('--bg'); ctx.globalAlpha = 0.85; ctx.fillRect(bx, by + bh, axW - 1, 10);
        ctx.globalAlpha = 1; ctx.fillStyle = mpC; ctx.fillText('Max Pain', bx + (axW - 1) / 2, by + bh + 5.5);
        ctx.font = `10px ${C('--mono')}`;
      }
    }
    // เส้น Gamma Flip (gmf itd / gmf M): เส้นประยาว-สั้น เต็มความกว้าง ป้ายราคาที่แกนขวา + ชื่อใต้ป้าย
    (oi.gmf || []).forEach(g => {
      const gp = g.p - gcOff(), yg = series.priceToCoordinate(gp);
      if (yg === null || yg <= 2 || yg >= plotH - 2) return;
      const yy = Math.round(yg) + .5, gc = C(g.col);
      ctx.globalAlpha = 0.95; ctx.strokeStyle = gc; ctx.lineWidth = 1.5; ctx.setLineDash([10, 3, 2, 3]);
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(plotW, yy); ctx.stroke(); ctx.setLineDash([]);
      ctx.font = `bold 10px ${C('--mono')}`;
      const axW = w - plotW, bh = 14, bx = plotW + 1, by = Math.round(yg - bh / 2);
      ctx.globalAlpha = 1; ctx.fillStyle = gc; ctx.fillRect(bx, by, axW - 1, bh);
      ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(gp.toFixed(2), bx + (axW - 1) / 2, by + bh / 2 + .5);
      ctx.font = `bold 8px ${C('--mono')}`;
      ctx.fillStyle = C('--bg'); ctx.globalAlpha = 0.85; ctx.fillRect(bx, by + bh, axW - 1, 10);
      ctx.globalAlpha = 1; ctx.fillStyle = gc; ctx.fillText(g.lab, bx + (axW - 1) / 2, by + bh + 5.5);
      // ชื่อเส้นกลางกราฟ (เหนือเส้นเล็กน้อย)
      ctx.font = `bold 9px ${C('--mono')}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.fillText(`${g.lab} ${gp.toFixed(1)}`, Math.round(plotW * 0.42), yy - 2);
      ctx.font = `10px ${C('--mono')}`;
    });
    ctx.globalAlpha = 1;
  }

  // ---------- ข่าวแดง (High impact) จาก Forex Factory ----------
  // GitHub Actions ดึงปฏิทินทุกชั่วโมงเก็บเป็น news.json ในรีโป แอปอ่านไฟล์นั้น
  // ที่อยู่ไฟล์ news.json: อ่านชื่อบัญชี/รีโปจากลิงก์ของหน้าเว็บเอง (เปลี่ยนชื่อรีโปภายหลังก็ยังใช้ได้)
  const GH_OWNER = 'OI-GOLD-PRO', GH_REPO = 'gold-oi-pro';
  const NEWS_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/news.json`;
  // หมายเหตุ: raw.githubusercontent แคชไฟล์ราว 5 นาที
  let news = [];
  async function loadNews() {
    try {
      let r = await fetch(NEWS_URL + '?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' }).catch(() => null);
      if (!r || !r.ok) r = await fetch('news.json?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      news = (j.events || []).filter(e => e.c === 'USD').map(e => ({ ...e, i: e.i || 'H', ms: Date.parse(e.date) })).filter(e => isFinite(e.ms)).sort((a, b) => a.ms - b.ms);
      dirty = true; paintNextNews(); paintSiren(); refreshBoard();
    } catch (e) {}
  }
  // ช่วงหลังข่าวออก (ภายใน 2 ชม.) ที่ยังไม่มีผล: ดึงใหม่ทุก 2 นาที, ปกติทุก 10 นาที

      // หลัก: Gold.F (BlackBull, เรียลไทม์) จับคู่แท่ง M1 ที่ปิดแล้ว 5 แท่งล่าสุด ใช้ค่ากลาง (median) → ไม่ดีเลย์แบบ Yahoo
      try {
        const g = await fetch(`${GC_WORKER}/gf?t=${Math.floor(Date.now() / 20000)}`, { cache: 'no-store' });
        const gb = g.ok ? ((await g.json()).bars || []) : [];
        gfOk = gb.length > 0;
        const d = [];
        for (let i = gb.length - 1; i >= 0 && d.length < 5; i--) {
          const t = gb[i][0];
          if (t + 60 > nowS || !pm.has(t)) continue;
          d.push([t, gb[i][4] - pm.get(t)]);
        }
        if (d.length >= 2 && nowS - d[0][0] < 30 * 60) {
          const v = d.map(x => x[1]).sort((a, b) => a - b), m = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
          const off = Math.round(m * 100) / 100;
          if (isFinite(off) && Math.abs(off) <= 40) {
            liveSrc = 'Gold.F';
            if (liveAt === null || Math.abs(-off - gAdj) >= 0.01) { liveAt = d[0][0]; applyAdj(-off); } else { liveAt = d[0][0]; paintOff(); }
            return;
          }
        }
      } catch (e) {}
      // สำรอง: Yahoo GC=F (ช้า ~10 นาที) เฉพาะเมื่อดึง Gold.F ไม่ได้ · ถ้า Gold.F มีข้อมูลแต่เก่า = ตลาดปิด ไม่ต้องเรียก Yahoo ให้เปลืองโควตา
      if (gfOk) return;
      liveSrc = 'Yahoo';
      let bars = [];
      try { const w = await fetch(`${GC_WORKER}/?tf=1m`, { cache: 'no-store' }); if (w.ok) bars = ((await w.json()).bars || {})['1m'] || []; } catch (e) {}
      if (!bars.length) { const r = await fetch(GCY_URL + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' }); bars = ((await r.json()).bars || {})['1m'] || []; }   // [t(วินาที), o, h, l, c]
      for (let i = bars.length - 1; i >= 0 && i >= bars.length - 40; i--) {
        const t = Math.floor(bars[i][0] / 60) * 60;
        if (t + 60 > nowS) continue;            // แท่งที่ยังไม่ปิด ข้าม
        if (!pm.has(t)) continue;
        if (nowS - t > 90 * 60) return;         // ข้อมูลเก่าเกิน 90 นาที ไม่ใช้
        const off = Math.round((bars[i][4] - pm.get(t)) * 100) / 100;
        if (!isFinite(off) || Math.abs(off) > 40) return;
        if (liveAt === null || Math.abs(-off - gAdj) >= 0.01) { liveAt = t; applyAdj(-off); } else { liveAt = t; paintOff(); }
        return;
      }
    } catch (e) {}
    finally { liveBusy = false; }
  }
  setInterval(pairYahoo, 60000); setTimeout(pairYahoo, 5000);
  // (เดิม) คำนวณ offset ใหม่: GC ประมาณ = spot ล่าสุด + carry → offset = GC − perp (ปิดใช้งาน)
  function refreshAdj(force) {

  async function updateBasis() {

      const spot = Number((await r.json()).price);

  // ทุก 1 ชั่วโมง: อ่านชีตใหม่ (OI/carry ล่าสุด) แล้วคำนวณ offset ใหม่

  // ตลาดทอง CME ปิด: ศุกร์ 17:00 ET ถึงอาทิตย์ 18:00 ET และพักทุกวัน 17:00–18:00 ET
  // perp เทรดตลอด 24 ชม. จึงตัดแท่งช่วงนี้ทิ้ง ให้กราฟตรงกับกราฟฟิวเจอร์

  const closedCache = new Map();
  function cmeClosed(ms) {
    const hk = Math.floor(ms / 3600000);
    if (closedCache.has(hk)) return closedCache.get(hk);
    const parts = etFmt.formatToParts(new Date(hk * 3600000));
    const wd = parts.find(x => x.type === 'weekday').value, h = +parts.find(x => x.type === 'hour').value;
    const c = wd === 'Sat' || (wd === 'Fri' && h >= 17) || (wd === 'Sun' && h < 18) || h === 17;
    closedCache.set(hk, c);
    return c;
  }

  async function fetchBars(p, t, n) {
    if (p.fetchRows) return p.fetchRows(t, n);
    const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 7000);
    try {
      const r = await fetch(p.rest(t, n), { cache: 'no-store', signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rows = p.parse(await r.json(), t).sort((a, b) => a[0] - b[0]);
      if (!rows.length) throw new Error('no data');
      return rows;
    } finally { clearTimeout(timer); }
  }

  async function loadDayOpen() {

  function openWS() {

    if (!prov) return;
    const p = prov, t = tf;

          rows.forEach(k => {
            const b = toBar(k);

            series.update(b); lastBarTime = b.time; rawClose = k[4]; lastClose = rawClose - adj;
            const lastRaw = rawBars[rawBars.length - 1];

    ws = new WebSocket(p.ws(t));
    ws.onopen = () => {
      if (p.sub) ws.send(JSON.stringify(p.sub(t)));
      if (p.ping) pingTimer = setInterval(() => { try { ws.send(p.ping); } catch (e) {} }, p.pingMs);
      $('dot').classList.add('live');
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      const rows = p.msg(m, t);
      if (!rows) return;
      // อัปเดตเฉพาะแท่งล่าสุดหรือใหม่กว่า (snapshot ของบางแหล่งส่งแท่งเก่ามาด้วย)
      rows.sort((a, b) => a[0] - b[0]).forEach(k => {
        if (cmeClosed(k[0])) return; // ช่วงตลาดทอง CME ปิด ไม่วาดแท่ง

          series.update(b); lastBarTime = b.time; rawClose = k[4]; lastClose = rawClose - adj;
          const lastRaw = rawBars[rawBars.length - 1];
          if (lastRaw && lastRaw[0] === k[0]) rawBars[rawBars.length - 1] = k; else rawBars.push(k);
        } catch (e) {}

    };

    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // ---------- อินดิเคเตอร์ (ปุ่ม ƒx: เปิด/ปิด และปรับค่าได้ จำไว้ในเครื่อง) ----------
  // คำนวณจากแท่งที่แสดงบนกราฟ (สเกล GC หลังบวก offset)
  const IND = [
    { id: 'ema1', type: 'ema', name: 'EMA', p: { n: 20 }, col: '#f5d76e' },
    { id: 'ema2', type: 'ema', name: 'EMA', p: { n: 50 }, col: '#4fc3f7' },

  ];
  const PLABEL = { n: 'คาบ', k: 'ตัวคูณ', ob: 'บน', os: 'ล่าง', f: 'เร็ว', s: 'ช้า', g: 'สัญญาณ', sm: 'smooth' };
  const PLABEL_STOCH = { k: '%K', d: '%D', sm: 'smooth', ob: 'บน', os: 'ล่าง' };
  let indCfg = {};
  try { indCfg = JSON.parse(localStorage.getItem('oit_ind2' + PSFX) || 'null') || {}; } catch (e) { indCfg = {}; }
  // ย้ายค่าจากรุ่นก่อน (V1.6.00)
  if (!EMBED) try {
    const old = JSON.parse(localStorage.getItem('oit_ind') || '{}') || {};
    const map = { ema20: 'ema1', ema50: 'ema2', ema200: 'ema3', bb: 'bb', rsi: 'rsi', macd: 'macd' };
    let moved = false;
    Object.keys(map).forEach(k => { if (old[k] && !indCfg[map[k]]) { indCfg[map[k]] = { on: true }; moved = true; } });
    if (moved) localStorage.setItem('oit_ind2', JSON.stringify(indCfg));
    localStorage.removeItem('oit_ind');
  } catch (e) {}
  const cfgOf = d => { const c = indCfg[d.id] || {}; return { on: !!c.on, p: Object.assign({}, d.p, c.p || {}) }; };
  const saveInd = () => { try { localStorage.setItem('oit_ind2' + PSFX, JSON.stringify(indCfg)); } catch (e) {} };
  const indSeries = {};
  let oscFrac = 0; // สัดส่วนความสูงล่างที่ออสซิลเลเตอร์ใช้ (ไม่วาดแท่ง OI ทับ)
  const lineOpt = (col, extra) => Object.assign({ color: col, lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false }, extra || {});

  // ---- สูตร ----
  function emaArr(v, n) { const k = 2 / (n + 1), out = []; let e = null, cnt = 0; v.forEach(x => { if (x === null) { out.push(null); return; } cnt++; e = e === null ? x : x * k + e * (1 - k); out.push(cnt >= n ? e : null); }); return out; }
  function smaArr(v, n) { const out = []; let sum = 0; v.forEach((x, i) => { sum += x; if (i >= n) sum -= v[i - n]; out.push(i >= n - 1 ? sum / n : null); }); return out; }
  function rmaArr(v, n) { const out = []; let r = null; v.forEach((x, i) => { if (i < n - 1) { out.push(null); return; } if (r === null) { r = v.slice(0, n).reduce((a, b) => a + b, 0) / n; } else r = (r * (n - 1) + x) / n; out.push(r); }); return out; }
  function trArr(B) { return B.map((b, i) => i ? Math.max(b.high - b.low, Math.abs(b.high - B[i - 1].close), Math.abs(b.low - B[i - 1].close)) : b.high - b.low); }

  function rebuildSeries() {
    Object.keys(indSeries).forEach(id => { indSeries[id].forEach(sr => { try { chart.removeSeries(sr); } catch (e) {} }); delete indSeries[id]; });
    const add = o => chart.addLineSeries(o);
    const on = IND.filter(d => cfgOf(d).on);
    on.filter(d => !d.osc).forEach(d => {
      if (d.type === 'ema' || d.type === 'sma') indSeries[d.id] = [add(lineOpt(d.col, { lineWidth: d.w || 1 }))];
      else if (d.type === 'bb') indSeries.bb = [add(lineOpt(d.col, { lineStyle: 2 })), add(lineOpt(d.col)), add(lineOpt(d.col, { lineStyle: 2 }))];
      else if (d.type === 'st') indSeries.st = [add(lineOpt('#26a69a', { lineWidth: 2 })), add(lineOpt('#ef5350', { lineWidth: 2 }))];
    });
    const oscs = on.filter(d => d.osc);
    const H = oscs.length <= 1 ? 0.18 : oscs.length === 2 ? 0.16 : 0.13, gapB = 0.05;
    oscs.forEach((d, i) => {
      const bottom = gapB + (oscs.length - 1 - i) * (H + 0.01), top = 1 - bottom - H, p = cfgOf(d).p, sid = d.id;
      const o = (col, x) => lineOpt(col, Object.assign({ priceScaleId: sid }, x || {}));
      if (d.type === 'rsi') {
        indSeries.rsi = [add(o(d.col, { lastValueVisible: true, priceFormat: { type: 'price', precision: 1, minMove: 0.1 } }))];
        [p.ob, p.os].forEach(v => indSeries.rsi[0].createPriceLine({ price: v, color: 'rgba(255,183,77,.45)', lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
      } else if (d.type === 'macd') {
        indSeries.macd = [chart.addHistogramSeries({ priceScaleId: sid, priceLineVisible: false, lastValueVisible: false, priceFormat: { type: 'price', precision: 2, minMove: 0.01 } }),
          add(o('#4fc3f7', { lastValueVisible: true })), add(o('#ff8a65'))];
      } else if (d.type === 'stoch') {
        indSeries.stoch = [add(o('#4dd0e1', { lastValueVisible: true, priceFormat: { type: 'price', precision: 1, minMove: 0.1 } })), add(o('#ff8a65'))];
        [p.ob, p.os].forEach(v => indSeries.stoch[0].createPriceLine({ price: v, color: 'rgba(77,208,225,.45)', lineWidth: 1, lineStyle: 2, axisLabelVisible: false }));
      } else if (d.type === 'atr') {
        indSeries.atr = [add(o(d.col, { lastValueVisible: true }))];
      }
      chart.priceScale(sid).applyOptions({ scaleMargins: { top, bottom }, borderVisible: false });
    });
    const bot = oscs.length ? gapB + oscs.length * (H + 0.01) + 0.02 : 0.08;
    chart.priceScale('right').applyOptions({ scaleMargins: { top: .08, bottom: bot } });
    oscFrac = oscs.length ? bot - 0.02 : 0;
    $('indBtn').classList.toggle('has', on.length > 0);
    indRefresh();
  }
  function indRefresh() {
    try {
      if (!rawBars.length || !Object.keys(indSeries).length) { dirty = true; return; }
      const B = rawBars.map(toBar), T = B.map(b => b.time), C = B.map(b => b.close);
      const line = arr => arr.map((v, i) => v === null || v === undefined || !isFinite(v) ? { time: T[i] } : { time: T[i], value: v });
      IND.forEach(d => {
        const S = indSeries[d.id]; if (!S) return;
        const p = cfgOf(d).p;
        if (d.type === 'ema') S[0].setData(line(emaArr(C, p.n)));
        else if (d.type === 'sma') S[0].setData(line(smaArr(C, p.n)));
        else if (d.type === 'bb') {
          const n = p.n, up = [], mid = [], lo = [];
          C.forEach((_, i) => {
            if (i < n - 1) { up.push(null); mid.push(null); lo.push(null); return; }
            const w = C.slice(i - n + 1, i + 1), m = w.reduce((a, b) => a + b, 0) / n;
            const sd = Math.sqrt(w.reduce((a, b) => a + (b - m) * (b - m), 0) / n);
            up.push(m + p.k * sd); mid.push(m); lo.push(m - p.k * sd);
          });
          S[0].setData(line(up)); S[1].setData(line(mid)); S[2].setData(line(lo));
        } else if (d.type === 'st') {
          const atr = rmaArr(trArr(B), p.n), up = [], dn = [];
          let fu = null, fl = null, trend = 1;
          B.forEach((b, i) => {
            if (atr[i] === null) { up.push(null); dn.push(null); return; }
            const hl2 = (b.high + b.low) / 2, bu = hl2 + p.k * atr[i], bl = hl2 - p.k * atr[i], pc = i ? B[i - 1].close : b.close;
            fu = (fu === null || bu < fu || pc > fu) ? bu : fu;
            fl = (fl === null || bl > fl || pc < fl) ? bl : fl;
            if (trend === 1 && b.close < fl) trend = -1; else if (trend === -1 && b.close > fu) trend = 1;
            up.push(trend === 1 ? fl : null); dn.push(trend === -1 ? fu : null);
          });
          S[0].setData(line(up)); S[1].setData(line(dn));
        } else if (d.type === 'rsi') {
          const n = p.n, out = [null]; let ag = 0, al = 0;
          for (let i = 1; i < C.length; i++) {
            const dd = C[i] - C[i - 1], g = Math.max(dd, 0), l = Math.max(-dd, 0);
            if (i <= n) { ag += g / n; al += l / n; out.push(i === n ? (al === 0 ? 100 : 100 - 100 / (1 + ag / al)) : null); }
            else { ag = (ag * (n - 1) + g) / n; al = (al * (n - 1) + l) / n; out.push(al === 0 ? 100 : 100 - 100 / (1 + ag / al)); }
          }
          S[0].setData(line(out));
        } else if (d.type === 'macd') {
          const ef = emaArr(C, p.f), es = emaArr(C, p.s);
          const mac = C.map((_, i) => ef[i] !== null && es[i] !== null ? ef[i] - es[i] : null);
          const sig = emaArr(mac, p.g);
          S[0].setData(mac.map((v, i) => v === null || sig[i] === null ? { time: T[i] } : { time: T[i], value: v - sig[i], color: v - sig[i] >= 0 ? 'rgba(38,166,154,.55)' : 'rgba(239,83,80,.55)' }));
          S[1].setData(line(mac)); S[2].setData(line(sig));
        } else if (d.type === 'stoch') {
          const raw = B.map((b, i) => {
            if (i < p.k - 1) return null;
            let hh = -Infinity, ll = Infinity;
            for (let j = i - p.k + 1; j <= i; j++) { hh = Math.max(hh, B[j].high); ll = Math.min(ll, B[j].low); }
            return hh === ll ? 50 : (b.close - ll) / (hh - ll) * 100;
          });
          const first = raw.findIndex(v => v !== null);
          const pad = (arr, off) => Array(off).fill(null).concat(arr);
          const kk = first < 0 ? raw : pad(smaArr(raw.slice(first), p.sm), first);
          const f2 = kk.findIndex(v => v !== null);
          const dd = f2 < 0 ? kk : pad(smaArr(kk.slice(f2), p.d), f2);
          S[0].setData(line(kk)); S[1].setData(line(dd));

      $('loginErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';
      $('loginBtn').disabled = false; $('loginBtn').textContent = 'เข้าสู่ระบบ';
      if (silent) $('code').value = code;
    }
  }
  $('loginForm').addEventListener('submit', e => { e.preventDefault(); tryLogin($('code').value, false); });
  $('logout').addEventListener('click', () => { $('code').value = ''; showLogin('ออกจากระบบแล้ว'); });

  if (!tfSec[tf]) tf = '5m';
  // เปิดแอป: ถ้าเคยใส่รหัสผ่านไว้ ตรวจซ้ำอัตโนมัติ ไม่ต้องกรอกใหม่
  $('loginVer').textContent = 'V' + APP_VER;
  let saved = null;
  try { saved = localStorage.getItem('oit_code'); } catch (e) {}
  $('symName').textContent = SC.name;
  window.OI = {
    fetchTF: async (t, n) => {
      const order = prov ? [prov, ...PROVIDERS.filter(p => p !== prov)] : PROVIDERS;
      for (const p of order) { try { return (await fetchBars(p, t, n)).filter(k => !cmeClosed(k[0])).map(k => Object.assign(toBar(k), { volume: k[5] || 0 })); } catch (e) {} }
      return null;
    },
    get tf() { return tf; }, sym: SYM, cfg: SC, sfx: SYMSFX, psfx: PSFX,
    chart, series, chartEl, hooks: overlayHooks,
    get oi() { return oi; }, get lastClose() { return lastClose; }, get cfgData() { return lastCfg; }, setLevels, get rawBars() { return rawBars; }, get adj() { return adj; }, beep: () => { try { beep(); } catch (e) {} },
    showToast, hideToast, lockChart,
    markDirty() { dirty = true; },
    HUB, get rawClose() { return rawClose; }, get authCode() { return authCode; },
    get drawTool() { return typeof drawTool === 'undefined' ? null : drawTool; },
    gcOff, showPrice,
    setBrokerBasis(b) { brokerBasis = b; setChartAdj(b); },
    clearBrokerBasis() { if (brokerBasis === null) return; brokerBasis = null; if (basisEma !== null) setChartAdj(basisEma); },
  };
  if (saved) { $('login').hidden = true; $('chips').innerHTML = '<span class="chip">กำลังตรวจสอบรหัสผ่าน…</span>'; tryLogin(saved, true); }
})();
