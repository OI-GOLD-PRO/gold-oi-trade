<style>
  /* Layout: แถบหัวราคา > ชิปข้อมูล OI > ปุ่มไทม์เฟรม > กราฟเต็มจอ (มี overlay วาดแท่ง OI ทับ) */
  :root {
    --bg: #0b1020;        /* พื้นหลังกราฟ น้ำเงินกรมเข้ม */
    --panel: #121a30;
    --line: #1f2a46;
    --fg: #e6e9f2;
    --muted: #8a93ab;
    --gold: #e0b44c;      /* สีแบรนด์ทอง ใช้กับราคา/ปุ่มที่เลือก */
    --put: #e5576b;       /* Put = แนวรับ (โทนแดง) */
    --call: #2fbf8f;      /* Call = แนวต้าน (โทนเขียว) */
    --live: #2fbf8f;
    --gmfi: #22d3ee;      /* gmf itd (Gamma Flip สัญญาวันนั้น) */
    --gmfm: #f59e0b;      /* gmf M (Gamma Flip ทุกสัญญา ≤30 วัน) */
    --mp: #ff3fb4;        /* Max Pain สีบานเย็น */      /* จุดสถานะเชื่อมต่อสด */
    --volc: #8ccaff;      /* Volume Call ฟ้าอ่อน */
    --volp: #ffb98a;      /* Volume Put ส้มอ่อน */
    --up: #26a69a;
    --down: #ef5350;
    --sans: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; height: 100dvh; margin: 0; background: var(--bg); color: var(--fg); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
  /* เต็มจอจริงบน iPhone (แอปจากหน้าโฮมบางรุ่นคิด 100dvh สั้นกว่าจอ ทำให้มีช่องว่างด้านล่าง) */
  body { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: auto; box-sizing: border-box; }
  /* iOS 26: ขอบบนจอ (ใต้แถบสถานะ) ถูกเบลอโดยระบบ ดันหัวแอปลงมาพ้นโซนเบลอ */
  /* iPhone: ให้แถบเวลา/คำอธิบายสีชิดขอบล่าง เหลือเว้นเฉพาะใต้ขีด Home เล็กน้อย */
  @supports (-webkit-touch-callout: none) { body { padding-top: calc(env(safe-area-inset-top, 0px) + 6px); padding-bottom: max(4px, calc(env(safe-area-inset-bottom, 0px) - 22px)); } }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px 6px; }
  .sym { display: flex; flex-direction: row; align-items: baseline; gap: 6px; min-width: 0; flex: 0 1 auto; }
  .sym b { white-space: nowrap; }
  #src { display: block; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header > * { flex: none; }
  header > .sym { flex: 0 1 auto; min-width: 0; }
  @media (max-width: 440px) { header { flex-wrap: wrap; gap: 6px !important; row-gap: 6px; } header > .sym { flex: 1 1 calc(100% - 64px); } header > .px { margin-left: 0; margin-right: auto; text-align: left; } button.icon { width: 32px; height: 32px; font-size: 14px; } .siren .new { display: none; } }
  .sym b { font-size: 15px; font-weight: 600; letter-spacing: .02em; }

  .symbtn i { font-style: normal; font-size: 10px; color: var(--gold); }
  #symMenu { position: absolute; top: 46px; left: 12px; z-index: 40; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
  #symMenu button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; color: var(--fg); padding: 9px 14px; border-radius: 8px; font: 600 14px var(--mono); white-space: nowrap; }
  #symMenu button.on { background: rgba(212,175,55,.16); color: var(--gold); }
  #symMenu button em { font-style: normal; font-size: 18px; }

  .sym span { font-size: 11px; color: var(--muted); }

  .px #price { font-size: 22px; font-weight: 600; color: var(--gold); }

  /* ไซเรนข่าวแดง: กระพริบเมื่อข่าวจะออกภายใน 30 นาที */
  .siren { margin: 0 6px; flex: none; display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; color: inherit; font: inherit; line-height: 1; }
  .siren .bulb { font-size: 22px; filter: grayscale(.85) brightness(.75); }
  .siren .new { margin-top: 2px; font: 700 9px var(--mono); color: #3ddc84; letter-spacing: .03em; }
  .siren.on .bulb { filter: none; animation: sirenBlink .6s steps(2, start) infinite; }
  @keyframes sirenBlink { 0% { opacity: 1; filter: drop-shadow(0 0 6px #ff3b3b); } 100% { opacity: .25; } }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--live); box-shadow: 0 0 6px var(--live); }
  button.icon { background: var(--panel); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; width: 34px; height: 34px; font-size: 16px; flex: none; }
  header { gap: 8px !important; }
  /* หน้าเข้าสู่ระบบ: ทับทั้งจอจนกว่าจะใส่รหัสผ่านถูก */
  /* ===== อินโทรตอนเปิดแอป ===== */
  #splash { position: fixed; inset: 0; z-index: 80; background: radial-gradient(120% 80% at 50% 35%, #141b3a 0%, #0b1020 60%, #070a16 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; }
  #splash.out { animation: spOut .45s ease forwards; pointer-events: none; }
  @keyframes spOut { to { opacity: 0; transform: scale(1.06); filter: blur(4px); } }
  #splash .grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px); background-size: 28px 28px; mask-image: radial-gradient(70% 55% at 50% 45%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(70% 55% at 50% 45%, #000 30%, transparent 75%); animation: spGrid 1.2s ease both; }
  @keyframes spGrid { from { opacity: 0; transform: translateY(14px); } }
  #splash .logo { position: relative; width: min(62vw, 300px); }
  #splash .logo svg { width: 100%; height: auto; display: block; overflow: visible; }
  #splash .oi { transform-origin: 50% 60%; animation: spOi .7s cubic-bezier(.2,1.4,.4,1) .15s both; }
  @keyframes spOi { from { opacity: 0; transform: translateY(18px) scale(.7); } }
  #splash .shine { animation: spShine 1.1s ease-in-out .75s both; }
  @keyframes spShine { from { transform: translateX(-160px); } to { transform: translateX(420px); } }
  #splash .gp { animation: spGp .6s ease .55s both; }
  @keyframes spGp { from { opacity: 0; letter-spacing: 18px; } to { opacity: 1; letter-spacing: 2px; } }
  #splash .bar { transform-box: fill-box; transform-origin: right center; animation: spBar .5s cubic-bezier(.2,.9,.3,1) both; }
  #splash .b1 { animation-delay: .85s; } #splash .b2 { animation-delay: .95s; } #splash .b3 { animation-delay: 1.05s; } #splash .b4 { animation-delay: 1.15s; }
  @keyframes spBar { from { transform: scaleX(0); opacity: .2; } }
  #splash .mp { stroke-dasharray: 22 14; animation: spFade .6s ease 1.1s both, spDash 1.2s linear 1.7s infinite; }
  #splash .mpMask { transform-box: fill-box; transform-origin: left center; animation: spWipe .6s ease 1.1s both; }
  @keyframes spWipe { from { transform: scaleX(0); } }
  @keyframes spDash { to { stroke-dashoffset: -36; } }
  #splash .px { margin-top: 26px; font: 600 15px ui-monospace, "SF Mono", Menlo, monospace; color: #e0b44c; letter-spacing: 1px; min-height: 18px; animation: spFade .4s ease 1.2s both; }
  #splash .load { margin-top: 12px; width: min(46vw, 220px); height: 3px; border-radius: 3px; background: rgba(255,255,255,.08); overflow: hidden; animation: spFade .3s ease 1.2s both; }
  #splash .load i { display: block; height: 100%; width: 40%; border-radius: 3px; background: linear-gradient(90deg, transparent, #e0b44c, transparent); animation: spRun 1s ease-in-out infinite; }
  @keyframes spRun { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  #splash .ver { margin-top: 10px; font: 600 12px var(--mono, monospace); color: #e0b44c; letter-spacing: 1.5px; opacity: .85; animation: spFade .5s ease 1.1s both; }
  #splash .st { margin-top: 12px; min-height: 16px; font-size: 12px; color: #8a93ad; text-align: center; padding: 0 24px; }
  #splash .retry { margin-top: 10px; padding: 9px 22px; border: 0; border-radius: 10px; background: #e0b44c; color: #1a1405; font: 600 14px -apple-system, sans-serif; }
  #splash .tag { position: absolute; bottom: calc(env(safe-area-inset-bottom, 0px) + 28px); font-size: 11px; color: #8a93ad; letter-spacing: 1px; animation: spFade .5s ease 1.3s both; }
  @keyframes spFade { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #splash * { animation-duration: .01ms !important; animation-delay: 0s !important; } }
  #login { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }

  button.icon:active { transform: scale(.95); }

  #drawBar button { background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 7px; padding: 6px 8px; font: 600 11.5px var(--sans); }

  #gsTbl .c.cur { border-color: var(--gold); }

  #gsTbl .u { color: #26c281; } #gsTbl .d { color: #ef5350; } #gsTbl .u.s, #gsTbl .d.s { font-weight: 900; }
  #indMenu .gsbox { display: grid; gap: 5px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }

  /* เลย์เอาต์ 2 กราฟ */
  #main { position: relative; display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; min-width: 0; }

  body.lay-h { flex-direction: row; }

  <script>
  // อินโทร: ปิดเมื่อกราฟพร้อม (เล่นอย่างน้อย 1.2 วินาที) · เกิน 2.5 วินาทีแสดงสถานะ · เกิน 6 วินาทีเข้าแอปเลย · แตะเพื่อข้าม · ออฟไลน์มีปุ่มลองใหม่
  (function () {
    var el = document.getElementById('splash'), t0 = Date.now(), closed = false, pend = '', MIN = 1200, SHOW_ST = 2500, MAX = 6000;
    if (/[?&]pane=b/.test(location.search)) { el.remove(); window.OISplash = { done: function () {}, status: function () {}, start: function () {} }; return; }
    var saved = null; try { saved = localStorage.getItem('oit_code'); } catch (e) {}
    var running = false, gen = 0, st = document.getElementById('spSt');
    function close() { if (closed) return; closed = true; el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }
    function paint() { if (!closed && Date.now() - t0 >= SHOW_ST && navigator.onLine !== false) st.textContent = pend; }
    function offline() {
      if (closed) return;
      document.getElementById('spLoad').style.display = 'none';
      st.innerHTML = '📡 ไม่มีอินเทอร์เน็ต<br><button class="retry" id="spRetry">ลองใหม่</button>';
      document.getElementById('spRetry').onclick = function (e) { e.stopPropagation(); location.reload(); };
    }
    // เริ่มเล่น: เปิดแอปที่ล็อกอินค้างไว้ = เล่นทันที · ยังไม่ล็อกอิน = ซ่อนไว้ แล้วเล่นหลังกดเข้าสู่ระบบสำเร็จ
    function start() {
      if (running || closed) return; running = true; t0 = Date.now(); var g = ++gen;
      el.style.display = '';
      // ราคาล่าสุดจากครั้งก่อน นับขึ้นให้ดูมีชีวิต
      var px = null; try { px = JSON.parse(localStorage.getItem('oit_splash_px') || 'null'); } catch (e) {}
      if (px && isFinite(px.p)) {
        var pel = document.getElementById('spPx'), s0 = t0 + 1200;
        (function step() { var now = Date.now(), k = Math.min(1, Math.max(0, (now - s0) / 600)); if (now >= s0) pel.textContent = px.n + ' ' + (px.p - 60 * Math.pow(1 - k, 3)).toFixed(2); if (k < 1 && !closed) requestAnimationFrame(step); })();
      }
      setTimeout(paint, SHOW_ST);
      setTimeout(function () { if (g !== gen || !running || navigator.onLine === false) return; close(); }, MAX);
      if (navigator.onLine === false) setTimeout(offline, 600);
    }
    el.addEventListener('click', function () { if (running) close(); });
    window.addEventListener('offline', function () { if (running) offline(); });
    window.OISplash = {
      start: start,
      // หน้าใส่รหัสขึ้น (รหัสหมดอายุ/ผิด): ซ่อนอินโทรไว้ก่อน รอล็อกอินใหม่
      login: function () { if (!running || closed) return; running = false; el.style.display = 'none'; st.textContent = ''; },
      done: function (p, n) { try { if (isFinite(p)) localStorage.setItem('oit_splash_px', JSON.stringify({ p: p, n: n || 'XAUUSD' })); } catch (e) {} if (!running) return; setTimeout(close, Math.max(0, MIN - (Date.now() - t0))); },
      status: function (t) { pend = t; paint(); }
    };
    if (saved) start(); else el.style.display = 'none';
  })();
  </script>

<script>
  // ---------- ทะเบียนแจ้งเตือน: แต่ละอย่าง (และอินดี้ที่เพิ่มทีหลัง) ลงชื่อไว้ ผู้ใช้เลือกเปิด/ปิดได้ในเมนู ⚙️ ----------
  window.OIAlerts = (() => {
    const list = [], KEY = 'oi_alert_types'; let pref = {}, master = () => false, onChange = () => {};
    try { pref = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) {}
    return {
      list,
      // id, ชื่อ, { def: ค่าเริ่มต้น, desc: คำอธิบาย, active: () => อินดี้นั้นเปิดอยู่ไหม (ไม่มี = แสดงเสมอ), push: เซิร์ฟเวอร์ส่งให้ได้ }
      reg(id, label, o) { const i = list.findIndex(x => x.id === id); const it = Object.assign({ id, label, def: true }, o || {}); if (i >= 0) list[i] = it; else list.push(it); onChange(); },
      type(id) { const it = list.find(x => x.id === id); return pref[id] !== undefined ? !!pref[id] : it ? it.def !== false : true; },
      set(id, v) { pref[id] = !!v; try { localStorage.setItem(KEY, JSON.stringify(pref)); } catch (e) {} onChange(); },
      on(id) { return master() && this.type(id); }, // เปิดแจ้งเตือนรวม + เปิดชนิดนี้
      _bind(m, ch) { master = m; onChange = ch; },
    };

  // ---------- ข่าวแดง (High impact) จาก Forex Factory ----------
  // GitHub Actions ดึงปฏิทินทุกชั่วโมงเก็บเป็น news.json ในรีโป แอปอ่านไฟล์นั้น
  // ที่อยู่ไฟล์ news.json: อ่านชื่อบัญชี/รีโปจากลิงก์ของหน้าเว็บเอง (เปลี่ยนชื่อรีโปภายหลังก็ยังใช้ได้)
  const GH_OWNER = 'OI-GOLD-PRO', GH_REPO = 'gold-oi-pro';

  // หมายเหตุ: raw.githubusercontent แคชไฟล์ราว 5 นาที
  let news = [];
  async function loadNews() {
    try {
      let r = await fetch(NEWS_URL + '?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' }).catch(() => null);
      if (!r || !r.ok) r = await fetch('news.json?t=' + Math.floor(Date.now() / 300000), { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      news = (j.events || []).filter(e => e.c === 'USD').map(e => ({ ...e, i: e.i || 'H', ms: Date.parse(e.date) })).filter(e => isFinite(e.ms)).sort((a, b) => a.ms - b.ms);
      dirty = true; paintNextNews(); paintSiren(); refreshBoard();
    } catch (e) {}
  }
  // ช่วงหลังข่าวออก (ภายใน 2 ชม.) ที่ยังไม่มีผล: ดึงใหม่ทุก 2 นาที, ปกติทุก 10 นาที
  function newsPollMs() {
    const now = Date.now();
    return news.some(e => e.ms <= now && now - e.ms < 2 * 3600e3 && !e.actual && (e.forecast || e.previous)) ? 120000 : 600000;
  }
  function scheduleNews() { setTimeout(() => { if (document.visibilityState === 'visible') loadNews(); scheduleNews(); }, newsPollMs()); }
  // แปลงเวลาข่าวเป็นตำแหน่ง x บนกราฟ (รองรับข่าวในอนาคตที่ยังไม่มีแท่ง)
  function newsX(ms) {
    const sec = tfSec[tf], ts = chart.timeScale();
    if (!sec || !rawBars.length || lastBarTime === null) return null;
    const t = Math.floor(ms / 1000) + TZ_SHIFT, tb = Math.floor(t / sec) * sec;
    // logicalToCoordinate รับเฉพาะเลขจำนวนเต็ม จึงหาระยะห่างแท่งเองแล้วคูณ
    const N = rawBars.length, xl = ts.logicalToCoordinate(N - 1), xp = ts.logicalToCoordinate(N - 2);
    if (xl === null) return null;
    const sp = (xp !== null && xl - xp > 0) ? xl - xp : (ts.options().barSpacing || 6);
    if (tb <= lastBarTime) { const x = ts.timeToCoordinate(tb); if (x !== null) return x + (t - tb) / sec * sp; }
    return xl + (t - lastBarTime) / sec * sp;
  }
  const NEWS_H = 14;
  const newsCol = e => e.i === 'H' ? '#ef4444' : '#f59e0b'; // แดง = High, ส้ม = Medium
  const thDay = ms => new Date(ms).toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
  // วันที่ไทย: ถ้าเป็นวันนี้แสดง "วันนี้ !!"
  const newsWhen = ms => {
    const hm = new Date(ms).toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', hour12: false, timeZone: 'Asia/Bangkok' });
    if (thDay(ms) === thDay(Date.now())) return `<b style="color:#3ddc84">วันนี้ !!</b> ${hm}`;
    return new Date(ms).toLocaleDateString('th-TH', { weekday: 'short', day: 'numeric', timeZone: 'Asia/Bangkok' }) + ' ' + hm;

  let histAdj = []; // [[วินาที, adj]] เรียงเวลา
  function adjFor(ms) {
    const n = histAdj.length; if (!n) return adj;
    const t = ms / 1000;
    if (t <= histAdj[0][0]) return histAdj[0][1];
    const [tl, al] = histAdj[n - 1];
    if (t >= tl) { const nowS = Date.now() / 1000; if (nowS <= tl) return adj; const w = Math.min(1, (t - tl) / (nowS - tl)); return al + (adj - al) * w; }
    let lo = 0, hi = n - 1; while (hi - lo > 1) { const m = (lo + hi) >> 1; if (histAdj[m][0] <= t) lo = m; else hi = m; }
    const [t0, a0] = histAdj[lo], [t1, a1] = histAdj[hi];
    return a0 + (a1 - a0) * (t - t0) / Math.max(1, t1 - t0);
  }
  async function loadHistBasis() {
    if (SYM !== 'gold' || SC.yahoo || !prov) return;
    try {
      const [yr, pr] = await Promise.all([fetch(`${GC_WORKER}/?tf=1h&t=${Math.floor(Date.now() / 600000)}`).then(r => r.json()), fetchBars(prov, '1h', 1000)]);
      const ys = ((yr.bars || {})['1h'] || []), pm = new Map(pr.map(k => [Math.floor(k[0] / 1000), k[4]]));
      const raw = [];
      ys.forEach(b => { const t = Math.floor(b[0] / 3600) * 3600; if (pm.has(t) && isFinite(b[4])) { const d = pm.get(t) - b[4]; if (Math.abs(d) <= 40) raw.push([t + 3600, d]); } }); // ใช้ราคาปิดของชั่วโมง = เวลาปลายแท่ง
      if (raw.length < 10) return;
      // กรองสัญญาณรบกวน: ค่ากลางของ 5 ชั่วโมงรอบข้าง
      histAdj = raw.map((x, i) => { const w = raw.slice(Math.max(0, i - 2), i + 3).map(y => y[1]).sort((a, b) => a - b); return [x[0], Math.round(w[w.length >> 1] * 100) / 100]; });
      if (rawBars.length) { try { series.setData(rawBars.map(toBar)); } catch (e) {} refreshQuarterPriceGrid(); indRefresh(); dirty = true; }
    } catch (e) {}
  }
  setInterval(() => { if (document.visibilityState === 'visible') loadHistBasis(); }, 30 * 60e3);
  const toBar = k => { const a = adjFor(k[0]); return { time: Math.floor(k[0] / 1000) + TZ_SHIFT, open: k[1] - a, high: k[2] - a, low: k[3] - a, close: k[4] - a }; };

  // ราคาทอง spot จาก gold-api.com ใช้วัดส่วนต่าง perp − spot แล้วเลื่อนกราฟลงให้ตรงกับราคา forex
  function paintOff() {
    const el = $('offchip'); if (!el) return;
    const t = adjAt ? adjAt.toLocaleTimeString('th-TH', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' }) : '';
    if (SC.yahoo) { el.hidden = true; return; } // กราฟ GC·Y ไม่ต้องแสดงชิปปลายกราฟ
    el.innerHTML = `GC−โบรก <b>${gcOff() >= 0 ? '+' : ''}${gcOff().toFixed(2)}</b>` + (liveAt !== null && SYM === 'gold' ? ` <small>· ${liveSrc} ${new Date(liveAt * 1000).toLocaleTimeString('th-TH', { hour12: false, hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' })}</small>` : '');
  }
  // gAdj = perp − GC (ใช้แปลง strike ของ OI), adj = perp − ราคาโบรก (ใช้เลื่อนกราฟ)
  function applyAdj(next) {
    gAdj = Math.round(next * 100) / 100; adjSet = true; adjAt = new Date();
    rebaseOI(); paintOff(); showPrice();
  }
  // ส่วนต่าง GC − ราคาโบรก: strike ของ OI บนกราฟ = strike − gcOff
  function gcOff() { return adj - gAdj; }
  function rebaseOI() {
    if (!oi) return;
    const g = gcOff();
    oi.rows.forEach(r => { r.price = oi.offset !== null ? Math.round((r.strike - g) * 100) / 100 : null; });
    oi.mpPrice = oi.maxPain === null ? null : oi.maxPain - g;
    dirty = true;
    if (typeof resetArming === 'function' && lastClose !== null) resetArming(lastClose);
  }
  // เลื่อนกราฟให้เท่าราคาโบรก (จาก EA) หรือราคา spot ถ้า EA ยังไม่ออนไลน์
  function setChartAdj(next) {
    next = Math.round(next * 100) / 100;
    if (next === adj) return;
    adj = next;
    if (rawBars.length) { try { series.setData(rawBars.map(toBar)); } catch (e) {} if (typeof indRefresh === 'function') indRefresh(); }
    if (rawClose !== null) lastClose = rawClose - adj;
    rebaseOI(); showPrice(); paintOff();
  }
  // offset สด: ทุก 1 นาที เอาแท่ง M1 ที่ "ปิดแล้ว" ล่าสุดของ Yahoo GC=F (gcy.json จาก GitHub Actions)
  // จับคู่กับแท่ง M1 ของ perp เวลาเดียวกัน offset = GC ปิดแท่งนั้น − perp ปิดแท่งนั้น แล้วปรับกราฟ XAUUSD
  // (ค่าของอดีตราว 10-20 นาทีตาม Yahoo แต่แม่นเพราะเทียบเวลาเดียวกัน แล้วใช้กับราคาปัจจุบัน)
  let liveAt = null, liveBusy = false, liveSrc = 'Yahoo';
  const GCY_URL = `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/gcy.json`;
  async function pairYahoo() {
    if (SYM !== 'gold' || liveBusy || !prov || !oi) return;
    liveBusy = true;
    try {
      const rows = await fetchBars(prov, '1m', 400);
      const pm = new Map(rows.map(k => [Math.floor(k[0] / 1000), k[4]])); // ราคาปิดแท่ง M1 ของ perp
      const nowS = Date.now() / 1000;
      let gfOk = false;
      // หลัก: Gold.F (BlackBull, เรียลไทม์) จับคู่แท่ง M1 ที่ปิดแล้ว 5 แท่งล่าสุด ใช้ค่ากลาง (median) → ไม่ดีเลย์แบบ Yahoo
      try {
        const g = await fetch(`${GC_WORKER}/gf?t=${Math.floor(Date.now() / 20000)}`, { cache: 'no-store' });
        const gb = g.ok ? ((await g.json()).bars || []) : [];
        gfOk = gb.length > 0;
        const d = [];
        for (let i = gb.length - 1; i >= 0 && d.length < 5; i--) {
          const t = gb[i][0];
          if (t + 60 > nowS || !pm.has(t)) continue;
          d.push([t, gb[i][4] - pm.get(t)]);
        }
        if (d.length >= 2 && nowS - d[0][0] < 30 * 60) {
          const v = d.map(x => x[1]).sort((a, b) => a - b), m = v.length % 2 ? v[(v.length - 1) / 2] : (v[v.length / 2 - 1] + v[v.length / 2]) / 2;
          const off = Math.round(m * 100) / 100;
          if (isFinite(off) && Math.abs(off) <= 40) {
            liveSrc = 'Gold.F';
            if (liveAt === null || Math.abs(-off - gAdj) >= 0.01) { liveAt = d[0][0]; applyAdj(-off); } else { liveAt = d[0][0]; paintOff(); }
            return;
          }
        }
      } catch (e) {}
      // สำรอง: Yahoo GC=F (ช้า ~10 นาที) เฉพาะเมื่อดึง Gold.F ไม่ได้ · ถ้า Gold.F มีข้อมูลแต่เก่า = ตลาดปิด ไม่ต้องเรียก Yahoo ให้เปลืองโควตา
      if (gfOk) return;
      liveSrc = 'Yahoo';
      let bars = [];
      try { const w = await fetch(`${GC_WORKER}/?tf=1m`, { cache: 'no-store' }); if (w.ok) bars = ((await w.json()).bars || {})['1m'] || []; } catch (e) {}
      if (!bars.length) { const r = await fetch(GCY_URL + '?t=' + Math.floor(Date.now() / 60000), { cache: 'no-store' }); bars = ((await r.json()).bars || {})['1m'] || []; }   // [t(วินาที), o, h, l, c]
      for (let i = bars.length - 1; i >= 0 && i >= bars.length - 40; i--) {
        const t = Math.floor(bars[i][0] / 60) * 60;
        if (t + 60 > nowS) continue;            // แท่งที่ยังไม่ปิด ข้าม
        if (!pm.has(t)) continue;
        if (nowS - t > 90 * 60) return;         // ข้อมูลเก่าเกิน 90 นาที ไม่ใช้
        const off = Math.round((bars[i][4] - pm.get(t)) * 100) / 100;
        if (!isFinite(off) || Math.abs(off) > 40) return;
        if (liveAt === null || Math.abs(-off - gAdj) >= 0.01) { liveAt = t; applyAdj(-off); } else { liveAt = t; paintOff(); }
        return;
      }
    } catch (e) {}
    finally { liveBusy = false; }
  }
  setInterval(pairYahoo, 60000); setTimeout(pairYahoo, 5000);
  // (เดิม) คำนวณ offset ใหม่: GC ประมาณ = spot ล่าสุด + carry → offset = GC − perp (ปิดใช้งาน)
  function refreshAdj(force) {
    return; // ปิดการลอยตาม spot/carry: offset ล็อกตามชีต
    if (carry === null || basisEma === null) return;
    if (!force && adjAt && Date.now() - adjAt.getTime() < REFRESH_MS - 5000) return;
    applyAdj(basisEma - carry);
  }
  async function updateBasis() {
    if (rawClose === null || !SC.carry) return;
    try {
      const r = await fetch('https://api.gold-api.com/price/XAU', { cache: 'no-store' });
      const spot = Number((await r.json()).price);
      const basis = rawClose - spot;
      if (!isFinite(basis) || Math.abs(basis) > 25) return;
      const first = basisEma === null;
      basisEma = first ? basis : basisEma * 0.7 + basis * 0.3;
      if (brokerBasis === null) setChartAdj(basisEma);
      if (first) refreshAdj(true);
    } catch (e) {}
  }
  setInterval(updateBasis, 30000);
  // ทุก 1 ชั่วโมง: อ่านชีตใหม่ (OI/carry ล่าสุด) แล้วคำนวณ offset ใหม่
  setInterval(() => { if (document.visibilityState === 'visible') loadSheet().then(() => refreshAdj(false)); }, REFRESH_MS);

  // ตลาดทอง CME ปิด: ศุกร์ 17:00 ET ถึงอาทิตย์ 18:00 ET และพักทุกวัน 17:00–18:00 ET
  // perp เทรดตลอด 24 ชม. จึงตัดแท่งช่วงนี้ทิ้ง ให้กราฟตรงกับกราฟฟิวเจอร์
  const etFmt = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', hourCycle: 'h23' });
  const closedCache = new Map();
  function cmeClosed(ms) {
    const hk = Math.floor(ms / 3600000);
    if (closedCache.has(hk)) return closedCache.get(hk);
    const parts = etFmt.formatToParts(new Date(hk * 3600000));
    const wd = parts.find(x => x.type === 'weekday').value, h = +parts.find(x => x.type === 'hour').value;
    const c = wd === 'Sat' || (wd === 'Fri' && h >= 17) || (wd === 'Sun' && h < 18) || h === 17;
    closedCache.set(hk, c);
    return c;
  }

  async function fetchBars(p, t, n) {
    if (p.fetchRows) return p.fetchRows(t, n);
    const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 7000);
    try {
      const r = await fetch(p.rest(t, n), { cache: 'no-store', signal: ac.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const rows = p.parse(await r.json(), t).sort((a, b) => a[0] - b[0]);
      if (!rows.length) throw new Error('no data');
      return rows;
    } finally { clearTimeout(timer); }
  }

  async function loadDayOpen() {
    if (!prov) return;
    try { const rows = await fetchBars(prov, '1d', 2); dayOpen = rows[rows.length - 1][1]; } catch (e) { dayOpen = null; }
  }

  function setSource(p) {
    const changed = prov !== p;
    prov = p;
    if (!SC.yahoo) { try { localStorage.setItem('oit_src', p.id); } catch (e) {} }
    $('src').textContent = `OI · Powered by “${p.name}” · V${APP_VER}`;
    if (changed) loadDayOpen().then(showPrice);
  }

  async function loadTF(next) {
    tf = next;
    try { localStorage.setItem('oit_tf' + PSFX, tf); } catch (e) {}
    document.querySelectorAll('#tfs button').forEach(b => b.classList.toggle('on', b.dataset.tf === tf));
    $('msg').hidden = false; $('msg').textContent = 'กำลังโหลดกราฟ…';
    window.OISplash && OISplash.status('กำลังเชื่อมต่อราคา…');
    const order = prov ? [prov, ...PROVIDERS.filter(p => p !== prov)] : PROVIDERS;
    const errs = [];
    for (const p of order) {
      try {
        if (p !== order[0]) window.OISplash && OISplash.status(`สลับแหล่งราคาสำรอง (${p.name})…`);
        const rows = (await fetchBars(p, tf, 800)).filter(k => !cmeClosed(k[0]));
        if (!rows.length) throw new Error('no data');
        rawBars = rows;
        const bars = rows.map(toBar);
        series.setData(bars);
        refreshQuarterPriceGrid();
        indRefresh();
        rawClose = rows[rows.length - 1][4];
        lastClose = rawClose - adj;
        lastBarTime = bars[bars.length - 1].time;
        updateBasis();
        setSource(p);
        showPrice();
        if (SC.yahoo) paintOff();
        chart.timeScale().scrollToRealTime();
        $('msg').hidden = true;
        window.OISplash && OISplash.done(lastClose, SC.name);
        if (!histAdj.length) setTimeout(loadHistBasis, 1500);
        dirty = true;
        openWS();
        return;
      } catch (e) { errs.push(`${p.name}: ${e.name === 'AbortError' ? 'timeout' : e.message}`); }
    }
    $('msg').textContent = 'ดึงราคาไม่ได้จากทุกแหล่ง (' + errs.join(' / ') + ') ลองกดเปลี่ยนไทม์เฟรมอีกครั้ง';
    window.OISplash && OISplash.done();
  }

  // V3.5.6: วาดแท่งจากข้อมูลสด/ที่ดึงมาเติม — อัปเดตเฉพาะแท่งล่าสุดหรือใหม่กว่า (snapshot บางแหล่งส่งแท่งเก่ามาด้วย)
  function applyRows(rows) {
    rows.sort((a, b) => a[0] - b[0]).forEach(k => {
      if (cmeClosed(k[0])) return; // ช่วงตลาดทอง CME ปิด ไม่วาดแท่ง
      const b = toBar(k);
      if (lastBarTime !== null && b.time < lastBarTime) return;
      try {
        series.update(b); lastBarTime = b.time; rawClose = k[4]; lastClose = rawClose - adj;
        const lastRaw = rawBars[rawBars.length - 1];
        if (lastRaw && lastRaw[0] === k[0]) rawBars[rawBars.length - 1] = k; else if (!lastRaw || k[0] > lastRaw[0]) rawBars.push(k);
      } catch (e) {}
    });
  }
  // ดึงแท่งล่าสุดผ่าน REST มาทับ (แก้แท่งค้าง/ขาดหลังสาย websocket เงียบหรือหลุด)
  let lastMsgAt = 0, backfilling = false;
  async function backfill(p, t) {
    if (backfilling || !p || p.fetchRows) return;
    backfilling = true;
    try {
      const rows = (await fetchBars(p, t, 30)).filter(k => !cmeClosed(k[0]));
      if (prov !== p || tf !== t) return;
      applyRows(rows); showPrice(); indTick(); dirty = true;
    } catch (e) {} finally { backfilling = false; }
  }
  // สุนัขเฝ้า websocket: ตลาดเปิดแต่ไม่มีแท่งใหม่เข้ามาเกิน 30 วินาที = สายค้าง → ต่อใหม่ + เติมแท่ง
  setInterval(() => {
    if (!ws || !prov || !prov.ws || document.visibilityState === 'hidden' || cmeClosed(Date.now())) return;
    if (Date.now() - lastMsgAt > 30000) openWS();
  }, 10000);
  // กันแท่งเพี้ยนสะสม: ทุก 1 นาทีดึงแท่งล่าสุดมาทับ (เบา 30 แท่ง)
  setInterval(() => { if (prov && prov.ws && document.visibilityState !== 'hidden' && !cmeClosed(Date.now())) backfill(prov, tf); }, 60000);

  function openWS() {
    clearTimeout(wsTimer); clearInterval(pingTimer); clearInterval(pollTimer);
    if (ws) { ws.onclose = null; ws.close(); }
    if (!prov) return;
    const p = prov, t = tf;
    if (!p.ws) { // ไม่มี websocket: ดึงซ้ำเป็นระยะ (ค่าเริ่ม 30 วินาที, กราฟ Yahoo ผสม 5 วินาที)
      $('dot').classList.add('live');
      let polling = false;
      pollTimer = setInterval(async () => {
        if (document.visibilityState === 'hidden' || tf !== t || polling) return;
        polling = true;
        try {
          const rows = (await fetchBars(p, t, 800)).filter(k => !cmeClosed(k[0]));
          rows.forEach(k => {
            const b = toBar(k);
            if (lastBarTime !== null && b.time < lastBarTime) return;
            series.update(b); lastBarTime = b.time; rawClose = k[4]; lastClose = rawClose - adj;
            const lastRaw = rawBars[rawBars.length - 1];
            if (lastRaw && lastRaw[0] === k[0]) rawBars[rawBars.length - 1] = k; else rawBars.push(k);
          });
          showPrice(); indTick(); checkAlerts(lastClose); if (SC.yahoo) paintOff();
        } catch (e) {} finally { polling = false; }
      }, p.pollMs || 30000);
      return;
    }
    ws = new WebSocket(p.ws(t));
    lastMsgAt = Date.now();
    ws.onopen = () => {
      lastMsgAt = Date.now();
      if (p.sub) ws.send(JSON.stringify(p.sub(t)));
      backfill(p, t); // V3.5.6: เติมแท่งที่ขาดช่วงสายหลุด/ต่อใหม่ ให้แท่งตรงกับเวลาจริง
      if (p.ping) pingTimer = setInterval(() => { try { ws.send(p.ping); } catch (e) {} }, p.pingMs);

      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }

      if (!rows) return;
      lastMsgAt = Date.now();
      applyRows(rows);
      showPrice();
      indTick();
      checkAlerts(lastClose);
    };
    ws.onclose = () => { clearInterval(pingTimer); $('dot').classList.remove('live'); wsTimer = setTimeout(openWS, 3000); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }

  // ---------- อินดิเคเตอร์ (ปุ่ม ƒx: เปิด/ปิด และปรับค่าได้ จำไว้ในเครื่อง) ----------
  // คำนวณจากแท่งที่แสดงบนกราฟ (สเกล GC หลังบวก offset)
  const IND = [
    { id: 'ema1', type: 'ema', name: 'EMA', p: { n: 20 }, col: '#f5d76e' },
    { id: 'ema2', type: 'ema', name: 'EMA', p: { n: 50 }, col: '#4fc3f7' },

    { id: 'rsi', type: 'rsi', name: 'RSI', p: { n: 14, ob: 70, os: 30 }, col: '#ffb74d', osc: true },
    { id: 'macd', type: 'macd', name: 'MACD', p: { f: 12, s: 26, g: 9 }, col: '#4fc3f7', osc: true },
    { id: 'stoch', type: 'stoch', name: 'Stochastic', p: { k: 14, d: 3, sm: 3, ob: 80, os: 20 }, col: '#4dd0e1', osc: true },
    { id: 'atr', type: 'atr', name: 'ATR', p: { n: 14 }, col: '#ce93d8', osc: true },
  ];
  const PLABEL = { n: 'คาบ', k: 'ตัวคูณ', ob: 'บน', os: 'ล่าง', f: 'เร็ว', s: 'ช้า', g: 'สัญญาณ', sm: 'smooth' };
  const PLABEL_STOCH = { k: '%K', d: '%D', sm: 'smooth', ob: 'บน', os: 'ล่าง' };
  let indCfg = {};
  try { indCfg = JSON.parse(localStorage.getItem('oit_ind2' + PSFX) || 'null') || {}; } catch (e) { indCfg = {}; }
  // ย้ายค่าจากรุ่นก่อน (V1.6.00)
  if (!EMBED) try {
    const old = JSON.parse(localStorage.getItem('oit_ind') || '{}') || {};
    const map = { ema20: 'ema1', ema50: 'ema2', ema200: 'ema3', bb: 'bb', rsi: 'rsi', macd: 'macd' };
    let moved = false;

    if (moved) localStorage.setItem('oit_ind2', JSON.stringify(indCfg));
    localStorage.removeItem('oit_ind');
  } catch (e) {}
  const cfgOf = d => { const c = indCfg[d.id] || {}; return { on: !!c.on, p: Object.assign({}, d.p, c.p || {}) }; };
  const saveInd = () => { try { localStorage.setItem('oit_ind2' + PSFX, JSON.stringify(indCfg)); } catch (e) {} };
  const indSeries = {};
  let oscFrac = 0; // สัดส่วนความสูงล่างที่ออสซิลเลเตอร์ใช้ (ไม่วาดแท่ง OI ทับ)

  // วาดด้วย pointer (ใช้ได้ทั้งนิ้วและเมาส์)
  let drawPid = null;
  chartEl.addEventListener('pointerdown', e => {
    if (!drawTool || drawTool === 'measure') return;
    const p = ptOf(e), q = ptAt(p); if (!q) return;
    e.preventDefault(); e.stopPropagation();
    if (drawTool === 'erase') { const i = hitDrawing(p); if (i >= 0) { drawings.splice(i, 1); saveDraw(); dirty = true; } return; }
    if (drawTool === 'hline') { drawings.push({ k: 'hline', a: q }); saveDraw(); dirty = true; setTool(null); return; }
    drawPid = e.pointerId; drawTmp = { k: drawTool, a: q, b: q }; dirty = true;
  }, { capture: true });
  chartEl.addEventListener('pointermove', e => {
    if (!drawTool || e.pointerId !== drawPid || !drawTmp) return;
    const q = ptAt(ptOf(e)); if (q) { drawTmp.b = q; dirty = true; }
    e.preventDefault(); e.stopPropagation();
  }, { capture: true });
  const drawUp = e => {
    if (!drawTool || e.pointerId !== drawPid || !drawTmp) return;
    drawPid = null;
    const A = toXY(drawTmp.a), B = toXY(drawTmp.b);
    if (A.x !== null && B.x !== null && Math.hypot(B.x - A.x, B.y - A.y) > 8) { drawings.push(drawTmp); saveDraw(); }
    drawTmp = null; dirty = true; setTool(null);
  };
  chartEl.addEventListener('pointerup', drawUp, { capture: true });
  chartEl.addEventListener('pointercancel', drawUp, { capture: true });
  document.addEventListener('click', e => {
    if (!$('drawBar').hidden && !drawTool && !e.target.closest('#drawBar') && !e.target.closest('#drawBtn') && !e.target.closest('#chart')) $('drawBar').hidden = true;
  });

  // ราคา XAUUSD จริงจากแหล่งที่ดึงกราฟ (ก่อนบวก offset)
  function paintRaw() {
    const el = $('rawchip'); if (!el) return;
    if (SC.yahoo) { el.hidden = true; return; } // กราฟ GC·Y ไม่ต้องแสดงชิปแหล่งราคา
    el.innerHTML = `${SC.name}${prov ? ' ' + esc(prov.name) : ''} <b>${rawClose !== null ? rawClose.toFixed(SC.dec) : '–'}</b>`;
  }
  function paintMM() {} // ตัดการแสดง MM vs MP ออกแล้ว (v1.14.01)
  function applyOiToggle() {
    const b = $('oiBtn'); b.classList.toggle('has', oiOn);
    b.style.opacity = oiOn ? '' : '.55';
    document.querySelectorAll('.legend > span:not(.rt)').forEach(e => { e.style.display = oiOn ? '' : 'none'; });
    dirty = true;
  }
  $('oiBtn').addEventListener('click', () => {
    oiOn = !oiOn;
    try { localStorage.setItem('oit_show' + PSFX, oiOn ? '1' : '0'); } catch (e) {}
    applyOiToggle();
  });
  applyOiToggle();
  function showPrice() {
    paintRaw(); paintMM();
    if (lastClose === null) return;
    const bp = window.OIT_brokerPrice ? window.OIT_brokerPrice() : null;
    $('price').textContent = (bp !== null && bp !== undefined ? bp : lastClose).toFixed(2);
    if (dayOpen) {
      const d = lastClose - (dayOpen - adj), pct = d / (dayOpen - adj) * 100;
      $('chg').textContent = `${d >= 0 ? '+' : ''}${d.toFixed(2)} (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%) วันนี้`;
      $('chg').style.color = d >= 0 ? C('--up') : C('--down');
    } else { $('chg').textContent = ''; }
  }

  // กลับมาเปิดแอปจากหน้าจอโฮม: ต่อ websocket ใหม่และเติมแท่งที่ขาด
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { if (started) { loadTF(tf); loadNews(); } if (!oi && authCode) loadSheet(); keepAwake(); try { actx && actx.resume(); } catch (e) {} }
  });

  setInterval(() => {
    const d = new Date();
    $('clock').textContent = d.toLocaleTimeString('th-TH', { hour12: false, timeZone: 'Asia/Bangkok' }) + ' น.';
  }, 1000);

  $('tfs').addEventListener('click', e => { const b = e.target.closest('button'); if (b && b.dataset.tf) loadTF(b.dataset.tf); });
  // ปุ่ม ⟳: ขึ้นสัญลักษณ์โหลดบนกราฟ จนกว่าข้อมูลชีต + ข้อมูลสดโหลดเสร็จและกราฟวาดใหม่แล้ว
  let reloading = false;
  $('reload').addEventListener('click', async () => {
    if (reloading) return; reloading = true;
    const ov = $('reloadOv'), btn = $('reload');
    ov.classList.add('on'); btn.classList.add('busy');
    const t0 = Date.now();
    try {
      while (syncing) await new Promise(r => setTimeout(r, 150));
      const L = window.OILive;
      await Promise.all([loadSheet(), L && L.poll ? Promise.resolve(L.poll()).catch(() => {}) : null]);
      dirty = true;
      await new Promise(r => setTimeout(r, Math.max(0, 600 - (Date.now() - t0))));
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    } finally { ov.classList.remove('on'); btn.classList.remove('busy'); reloading = false; }
  });

  // ---------- เข้าสู่ระบบด้วยรหัสผ่าน (ตรวจกับแท็บ users ในชีตผ่าน Apps Script) ----------
  let authCode = null, authExpire = null, started = false;
  const expLabel = s => String(s) >= '9999' ? 'อายุใช้งาน' : 'ใช้ได้ถึง';
  function fmtExpire(s) {
    if (String(s) >= '9999') return 'ไม่จำกัด';
    const d = new Date(s + 'T00:00:00+07:00');
    return isNaN(d) ? s : d.toLocaleDateString('th-TH-u-ca-gregory', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Bangkok' });
  }
  function showLogin(msg) {
    try { localStorage.removeItem('oit_code'); } catch (e) {}
    authCode = null; authExpire = null; oi = null; dirty = true;
    $('loginErr').textContent = msg || '';
    $('loginVer').textContent = 'V' + APP_VER;
    $('login').hidden = false;
    window.OISplash && OISplash.login();
    $('loginBtn').disabled = false; $('loginBtn').textContent = 'เข้าสู่ระบบ';
  }
  function enterApp(code, expire, name) {
    authCode = code; authExpire = expire || null;
    try { localStorage.setItem('oit_code', code); } catch (e) {}
    $('login').hidden = true;
    if (!started) { window.OISplash && OISplash.start(); started = true; loadTF(tf); if (!EMBED) { loadNews(); scheduleNews(); } }
    loadSheet();
    // กรอบต้อนรับแสดงวันละครั้ง (ตามวันที่ไทย) เปิดแอปรอบถัดไปในวันเดียวกันจะไม่ขึ้นอีก
    let welcomeToday = null;
    try { welcomeToday = localStorage.getItem('oit_welcome_day'); } catch (e) {}
    const todayTH = new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Bangkok' });
    if (expire && !EMBED && welcomeToday !== todayTH) {
      try { localStorage.setItem('oit_welcome_day', todayTH); } catch (e) {}
      showToast(`สวัสดี <b>${esc(name || '')}</b> วันนี้คือวันที่ดีสำหรับคุณ<br>${expLabel(expire)} <b>${esc(fmtExpire(expire))}</b>`);
    }
  }
  // ตรวจรหัสกับเซิร์ฟเวอร์: คืน {ok, expire} / {ok:false, reason} / {legacy:true} ถ้าสคริปต์ยังเป็นรุ่นเก่า
  async function checkLogin(code) {
    const ac = new AbortController(); const timer = setTimeout(() => ac.abort(), 15000);
    try {
      const r = await fetch(`${HUB}/app/login?t=${Date.now()}`, { cache: 'no-store', signal: ac.signal, headers: { 'X-Key': code } });
      return await r.json();
    } finally { clearTimeout(timer); }
  }
  async function tryLogin(code, silent) {
    code = String(code || '').trim();
    if (!code) { $('loginErr').textContent = 'กรุณาใส่รหัสผ่าน'; return; }
    $('loginBtn').disabled = true; $('loginBtn').textContent = 'กำลังตรวจสอบ…'; $('loginErr').textContent = '';
    try {
      // รหัสในชีตตรงตัวพิมพ์เล็ก/ใหญ่: ลองตามที่พิมพ์ก่อน แล้วลองตัวพิมพ์ใหญ่/เล็ก
      let res = await checkLogin(code);
      for (const alt of [code.toUpperCase(), code.toLowerCase()]) {
        if (res.ok || res.legacy || res.reason === 'expired' || alt === code) continue;
        const r2 = await checkLogin(alt);
        if (r2.ok || r2.reason === 'expired') { res = r2; code = alt; }
      }
      if (res.legacy) { enterApp(code, null); return; }
      if (res.ok) { enterApp(code, res.expire, res.name); return; }
      if (res.error === 'not found') { showLogin('hub ยังเป็นรุ่นเก่า — รัน npx wrangler deploy ในโฟลเดอร์ hub ก่อน'); return; }
      showLogin(res.reason === 'expired' ? `รหัสผ่านนี้หมดอายุแล้ว${res.expire ? ' (' + fmtExpire(res.expire) + ')' : ''}` : 'รหัสผ่านไม่ถูกต้อง');
    } catch (e) {
      $('login').hidden = false;
      $('loginErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';
      $('loginBtn').disabled = false; $('loginBtn').textContent = 'เข้าสู่ระบบ';
      if (silent) $('code').value = code;
    }
  }
  $('loginForm').addEventListener('submit', e => { e.preventDefault(); tryLogin($('code').value, false); });
  $('logout').addEventListener('click', () => { closeSettings(); $('code').value = ''; showLogin('ออกจากระบบแล้ว'); });

  if (!tfSec[tf]) tf = '5m';
  // เปิดแอป: ถ้าเคยใส่รหัสผ่านไว้ ตรวจซ้ำอัตโนมัติ ไม่ต้องกรอกใหม่
  $('loginVer').textContent = 'V' + APP_VER;
  let saved = null;
  try { saved = localStorage.getItem('oit_code'); } catch (e) {}
  $('symName').textContent = SC.name;
  window.OI = {
    fetchTF: async (t, n) => {
      const order = prov ? [prov, ...PROVIDERS.filter(p => p !== prov)] : PROVIDERS;
      for (const p of order) { try { return (await fetchBars(p, t, n)).filter(k => !cmeClosed(k[0])).map(k => Object.assign(toBar(k), { volume: k[5] || 0 })); } catch (e) {} }
      return null;
    },
    get tf() { return tf; }, sym: SYM, cfg: SC, sfx: SYMSFX, psfx: PSFX,
    chart, series, chartEl, hooks: overlayHooks,
    get oi() { return oi; }, get lastClose() { return lastClose; }, get cfgData() { return lastCfg; }, setLevels, get rawBars() { return rawBars; }, get adj() { return adj; }, beep: () => { try { beep(); } catch (e) {} },
    showToast, hideToast, lockChart,
    markDirty() { dirty = true; },
    HUB, get rawClose() { return rawClose; }, get authCode() { return authCode; },
    get drawTool() { return typeof drawTool === 'undefined' ? null : drawTool; },
    gcOff, showPrice,
    setBrokerBasis(b) { brokerBasis = b; setChartAdj(b); },
    clearBrokerBasis() { if (brokerBasis === null) return; brokerBasis = null; if (basisEma !== null) setChartAdj(basisEma); },
  };
  if (saved) { $('login').hidden = true; $('chips').innerHTML = '<span class="chip">กำลังตรวจสอบรหัสผ่าน…</span>'; tryLogin(saved, true); }
})();
