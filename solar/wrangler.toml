# โซลาร์บ้าน — Worker แยกจาก hub ของแอป OI (คนละชื่อ คนละฐานข้อมูล)
name = "solar-monitor"
main = "src/index.js"
compatibility_date = "2026-10-01"

# ดึงข้อมูลทุก 1 นาที (MPPT ทุก 2 นาที เพื่ออยู่ในโควตาฟรีของ Tuya)
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "solar-monitor-db"
database_id = "__D1_ID__"   # GitHub Actions ใส่ให้อัตโนมัติตอนขึ้นระบบ

[vars]
USABLE_AH = "371.2"    # ความจุใช้งานจริง = 120 Ah (ลูก 200 Ah มือสอง ใช้ได้ทั้งหมด) + 314 Ah x 80% (10%→90%)
FULL_SOC = "90"         # % ที่ถือว่าเต็ม (ชาร์จสูงสุดของเรา ~54.5V)
CUTOFF_V = "50"         # แรงดันตัด
CUTOFF_SOC = "10"       # % ที่ถือว่าหมด (LiFePO4 50V ≈ 10%)
NOMINAL_V = "51.2"
TUYA_REGION = "sg"      # Singapore Data Center
TUYA_DEVICE_ID = "a388c65aef93d7a41bfjah"
MPPT_EVERY_MIN = "2"
BMS_LABELS = "A5:C2:39:41:66:FA=200 Ah,A4:C1:37:25:E5:E2=314 Ah"   # BMS Bluetooth MAC=name (order = display order)
