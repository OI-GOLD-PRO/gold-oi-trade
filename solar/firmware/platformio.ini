; Stamp HOME · BMS relay — ESP32-WROOM-32 (HW-394 / DevKit V1 class boards)
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
  tzapu/WiFiManager@2.0.17
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DDEFAULT_MAC1=\"A5:C2:39:41:66:FA\"
  -DDEFAULT_MAC2=\"A4:C1:37:25:E5:E2\"
