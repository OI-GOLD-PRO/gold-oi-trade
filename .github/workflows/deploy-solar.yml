# Deploys the home-solar monitor (solar/) to Cloudflare — separate Worker + D1 from the OI hub.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID as deploy-hub.yml (token needs Workers + D1 edit).
# App secrets come from repo secrets: DESS_USER, DESS_PASSWORD, TUYA_CLIENT_ID, TUYA_SECRET, SOLAR_APP_KEY.
name: Deploy solar
on:
  push:
    branches: [main]
    paths: ["solar/**", ".github/workflows/deploy-solar.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Unit tests
        run: node test/run.mjs

      - name: Install wrangler
        run: npm install --no-save wrangler@4

      - name: Create D1 database if missing
        run: |
          find_id() {
            OUT=$(npx wrangler d1 list --json 2>&1) || { echo "::error title=D1 list failed::$(echo "$OUT" | tr '\n' ' ' | tail -c 600)"; exit 1; }
            echo "$OUT" | jq -r '.[] | select(.name=="solar-monitor-db") | .uuid' 2>/dev/null || { echo "::error title=D1 list not JSON::$(echo "$OUT" | tr '\n' ' ' | tail -c 600)"; exit 1; }
          }
          ID=$(find_id) || { echo "$ID"; exit 1; }
          if [ -z "$ID" ]; then
            OUT=$(npx wrangler d1 create solar-monitor-db 2>&1) || { echo "::error title=D1 create failed::$(echo "$OUT" | tr '\n' ' ' | tail -c 600)"; exit 1; }
            ID=$(find_id) || { echo "$ID"; exit 1; }
          fi
          echo "D1 id: $ID"
          sed -i "s/__D1_ID__/$ID/" wrangler.toml

      - name: Create tables
        run: npx wrangler d1 execute solar-monitor-db --remote --file=schema.sql -y

      - name: Migrate columns
        run: |
          for col in "inv_today_kwh REAL" "soc_calc REAL" "inv_mode TEXT"; do
            npx wrangler d1 execute solar-monitor-db --remote -y --command "ALTER TABLE samples ADD COLUMN $col" >/dev/null 2>&1 && echo "added $col" || echo "exists: $col"
          done

      - name: Deploy worker
        run: npx wrangler deploy | tee deploy.log

      - name: Upload app secrets
        env:
          DESS_USER: ${{ secrets.DESS_USER }}
          DESS_PASSWORD: ${{ secrets.DESS_PASSWORD }}
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_SECRET: ${{ secrets.TUYA_SECRET }}
          APP_KEY: ${{ secrets.SOLAR_APP_KEY }}
        run: |
          jq -n 'env | {DESS_USER, DESS_PASSWORD, TUYA_CLIENT_ID, TUYA_SECRET, APP_KEY}
                 | with_entries(select(.value != null and .value != ""))' > secrets.json
          SENT=$(jq -r 'keys | join(", ")' secrets.json)
          MISSING=$(jq -r '["DESS_USER","DESS_PASSWORD","TUYA_CLIENT_ID","TUYA_SECRET","APP_KEY"] - keys | join(", ")' secrets.json)
          echo "::notice title=Secrets::sent [${SENT}] missing [${MISSING}]"
          if [ "$(jq 'length' secrets.json)" -gt 0 ]; then npx wrangler secret bulk secrets.json; fi
          rm -f secrets.json

      - name: Show app link
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### โซลาร์บ้าน: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "App: $URL"
