# Deploys the hub to Cloudflare whenever hub/ changes on main.
# Needs repo secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# Hub secrets (APP_KEY, EA_KEY, OI_CODE, ...) stay on Cloudflare and are not touched by deploys.
name: Deploy hub
on:
  push:
    branches: [main]
    paths: ["hub/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: hub
