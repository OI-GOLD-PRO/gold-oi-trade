# Builds the ESP32 BMS-relay firmware (solar/firmware) into one flashable image.
# The image is committed to solar/firmware/dist/factory.bin so the /flash page of the app can install it
# from the browser (ESP Web Tools), and it is also kept as a run artifact.
name: Build BMS firmware
on:
  push:
    branches: [main]
    paths: ["solar/firmware/**", "!solar/firmware/dist/**", ".github/workflows/build-bms-firmware.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar/firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO + esptool
        run: pip install platformio esptool==4.8.1
      - name: Compile
        run: pio run
      - name: Decode crash backtrace (diagnostics)
        run: |
          ELF=.pio/build/esp32dev/firmware.elf
          sha256sum $ELF
          A2L=$(find ~/.platformio/packages -name xtensa-esp32-elf-addr2line | head -1)
          $A2L -pfiaC -e $ELF 0x4015f974 0x400838bd 0x40095989 0x4009b481 0x4015f793 0x400d526e 0x400d37ea 0x400f7d6e || true
      - name: Merge into one flashable image
        run: |
          mkdir -p dist
          B=.pio/build/esp32dev
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          echo "boot_app0: $BOOT"
          esptool.py --chip esp32 merge_bin -o dist/factory.bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: stamp-home-bms-firmware
          path: solar/firmware/dist/factory.bin
      - name: Commit the image for the web installer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/factory.bin
          if git diff --cached --quiet; then echo "image unchanged"; else
            git commit -m "Firmware build [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
