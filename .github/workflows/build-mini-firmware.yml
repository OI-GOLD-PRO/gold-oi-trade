# Builds OI Gold Pro Mini (mini/) into one flashable image and keeps it as a run artifact + mini/dist/factory.bin.
name: Build OI Gold Pro Mini firmware
on:
  push:
    branches: [main]
    paths: ["mini/**", "!mini/dist/**", ".github/workflows/build-mini-firmware.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO + esptool
        run: pip install platformio esptool==4.8.1
      - name: Compile
        run: pio run
      - name: Merge into one flashable image
        run: |
          mkdir -p dist
          B=.pio/build/cyd
          BOOT=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          esptool.py --chip esp32 merge_bin -o dist/factory.bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT" 0x10000 $B/firmware.bin
          cp $B/firmware.bin dist/firmware.bin
          V=$(grep -oP '#define FW_VER "\K[^"]+' OIGoldProMini/OIGoldProMini.ino)
          printf '{"v":"%s","size":%s,"sha":"%s"}\n' "$V" "$(stat -c%s dist/firmware.bin)" "${GITHUB_SHA::7}" > dist/version.json
          cat dist/version.json; ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: oi-gold-pro-mini-firmware
          path: mini/dist/factory.bin
      - name: Commit the image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/factory.bin dist/firmware.bin dist/version.json
          if git diff --cached --quiet; then echo "image unchanged"; else
            git commit -m "Mini firmware build [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
