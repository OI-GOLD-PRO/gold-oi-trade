# Read-only health check for the home-solar Worker: D1 state + SmartESS device list. Changes nothing.
name: Solar check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: solar
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save wrangler@4 >/dev/null 2>&1
      - name: Point wrangler at the D1 id
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="solar-monitor-db") | .uuid'); sed -i "s/__D1_ID__/$ID/" wrangler.toml
      - name: D1 state
        run: |
          q() { OUT=$(npx wrangler d1 execute solar-monitor-db --remote --json --command "$1" 2>&1); echo "$OUT" | jq -c '.[0].results' 2>/dev/null | cut -c1-900 || echo "$OUT" | tr '\n' ' ' | tail -c 400; }
          echo "::notice title=last samples::$(q "SELECT datetime(ts/1000,'unixepoch','+7 hours') t, batt_v, load_w, inv_pv_w, mppt_pv_w, inv_mode, err FROM samples ORDER BY ts DESC LIMIT 3")"
          echo "::notice title=last good inverter sample::$(q "SELECT datetime(ts/1000,'unixepoch','+7 hours') t, batt_v, load_w FROM samples WHERE load_w IS NOT NULL ORDER BY ts DESC LIMIT 1")"
          echo "::notice title=distinct errors 24h::$(q "SELECT substr(err,1,200) e, COUNT(*) n, datetime(MAX(ts)/1000,'unixepoch','+7 hours') last FROM samples WHERE ts > (strftime('%s','now')-86400)*1000 GROUP BY e ORDER BY last DESC LIMIT 4")"
          echo "::notice title=mppt 3h::$(q "SELECT COUNT(DISTINCT mppt_pv_w) distinct_pv, COUNT(DISTINCT mppt_a) distinct_a, MIN(mppt_pv_w) mn, MAX(mppt_pv_w) mx, datetime(MAX(ts)/1000,'unixepoch','+7 hours') last FROM samples WHERE ts > (strftime('%s','now')-10800)*1000")"
          echo "::notice title=mppt_last::$(q "SELECT substr(v,1,300) v FROM kv WHERE k='mppt_last'")"
          echo "::notice title=stale repair::$(q "SELECT v FROM kv WHERE k='dess_stale_repair_v1'")"
          echo "::notice title=dess_device::$(q "SELECT v FROM kv WHERE k='dess_device'")"
          echo "::notice title=bms_last::$(q "SELECT substr(v,1,200) v FROM kv WHERE k='bms_last'")"
      - name: SmartESS devices
        env:
          DESS_USER: ${{ secrets.DESS_USER }}
          DESS_PASSWORD: ${{ secrets.DESS_PASSWORD }}
          TUYA_CLIENT_ID: ${{ secrets.TUYA_CLIENT_ID }}
          TUYA_SECRET: ${{ secrets.TUYA_SECRET }}
          TUYA_DEVICE_ID: a3b564e1d50ef5ab2btd0r
        run: node tools/check.mjs
