# Deploys the portfolio dashboard hub (portdash/hub → Worker port-hub) to Cloudflare whenever it changes on main, after the offline tests pass.
# Uses the same CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID as deploy-hub.yml, plus repo secret
# PORT_ADMIN_KEY (the owner's login code for the app — any long random text).
name: Deploy portdash hub
on:
  push:
    branches: [main]
    paths: ["portdash/hub/**", "portdash/tools/**", ".github/workflows/deploy-portdash.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: node portdash/tools/test-hub.mjs && node portdash/tools/test-app.mjs
      - name: Deploy worker
        working-directory: portdash/hub
        run: npx --yes wrangler@4 deploy | tee deploy.log
      - name: Upload admin key
        working-directory: portdash/hub
        env:
          ADMIN_KEY: ${{ secrets.PORT_ADMIN_KEY }}
        run: |
          if [ -z "$ADMIN_KEY" ]; then echo "::warning title=PORT_ADMIN_KEY missing::set the repo secret, then re-run"; exit 0; fi
          printf '%s' "$ADMIN_KEY" | npx --yes wrangler@4 secret put ADMIN_KEY
      - name: Show hub link
        working-directory: portdash/hub
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Hub: $URL" >> "$GITHUB_STEP_SUMMARY"
