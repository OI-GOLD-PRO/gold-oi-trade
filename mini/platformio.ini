; OI Gold Pro Mini — ESP32 CYD 2.8" (ESP32-2432S028, 2 USB, ILI9341)
; ใช้ใน GitHub Actions เพื่อตรวจว่าคอมไพล์ผ่าน และสร้างไฟล์ factory.bin (Arduino IDE เปิดไฟล์ .ino ได้ตรงๆ)
[platformio]
src_dir = OIGoldProMini

[env:cyd]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bblanchon/ArduinoJson@^7.2.0
build_flags = -DCORE_DEBUG_LEVEL=0
